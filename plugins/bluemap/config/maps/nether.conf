# BlueMap map configuration: the nether (C2-07o).
# The world is read from the Paper volume, read only. See plugins/bluemap/README.md.

world: "world"
dimension: "minecraft:the_nether"
dimension-type: "minecraft:the_nether"
name: "Nether"
sorting: 1
start-pos: { x: 0, z: 0 }
sky-color: "#290000"
void-color: "#000000"
sky-light: 1
ambient-light: 0.1
remove-caves-below-y: -10000
cave-detection-ocean-floor: -5
cave-detection-uses-block-light: false
min-inhabited-time: 0
render-edges: true
edge-light-strength: 8
enable-perspective-view: true
enable-flat-view: true
enable-free-flight-view: true
enable-hires: true
storage: "file"
ignore-missing-light-data: false

# Static marker sets. None: no entity markers and no agent markers. Dynamic markers from other
# plugins are not installed on this shard.
marker-sets: {
}
