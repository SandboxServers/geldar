# BlueMap core configuration for the colo shard (C1-09).
# Read-only public terrain map. See plugins/bluemap/README.md.
# No secrets, tokens or addresses belong in this file.

# Mojang client assets (textures, models). Stays false in the repo. The owner sets it to true in the
# deployed copy only, after reading Mojang's terms (README, "The Mojang asset download").
accept-download: false

# The directory where BlueMap keeps its render data, relative to the server directory.
data: "bluemap"

# Automatic render threads (default: count from the CPU).
render-thread-count: 0

# Full re-render interval in minutes (default 1440). 0 disables it.
full-update-interval: 1440

# Region-file check interval in minutes (default 5).
region-file-check-interval: 5

# bStats metrics send a request to an outside server. Off, so the map makes no outbound call.
metrics: false
