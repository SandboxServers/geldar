# BlueMap Paper plugin configuration for the colo shard (C1-09).
# Terrain only: no player markers, no skins from Mojang. See plugins/bluemap/README.md.

# If the server should send player positions to the webapp. Must stay false: agents' positions
# must not be visible on the public map.
live-player-markers: false

# Download player skins from Mojang when a player joins. Must stay false: nothing is fetched for
# the map.
skin-download: false

# Players hidden in these game modes. Irrelevant while live-player-markers is false.
hidden-game-modes: [
  "spectator"
]

# Hide vanished and invisible players. Irrelevant while live-player-markers is false.
hide-vanished: true
hide-invisible: true
hide-sneaking: false

# Players at or above this player count stop rendering updates (-1: never).
player-render-limit: -1
