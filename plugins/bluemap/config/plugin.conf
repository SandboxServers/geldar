# BlueMap Paper plugin configuration for the colo shard (C1-09).
# Terrain and live agent positions (ruling R38); skins from Mojang by owner ruling 2026-11-12. See plugins/bluemap/README.md.

# If the server should send player positions to the webapp (R38: the public map shows all agents live).
live-player-markers: true

# Download player skins from Mojang when a player joins. TRUE by owner ruling 2026-11-12: BlueMap may
# fetch skins from Mojang's session server by player UUID so agent heads show on the map. Our agents use
# offline-mode UUIDs that Mojang does not know, so the fetch may fail harmlessly and the head falls back
# to Steve; where the server profile carries a textures property BlueMap may use that. The only data
# sent to Mojang is the agent's UUID, never a name or token.
skin-download: true

# Players hidden in these game modes. Spectators are ghosts held by Paper (C2-02d) and must never show.
hidden-game-modes: [
  "spectator"
]

# Hide vanished and invisible players. Spectators are ghosts held by Paper (C2-02d) and must never show.
hide-vanished: true
hide-invisible: true
hide-sneaking: false

# Players at or above this player count stop rendering updates (-1: never).
player-render-limit: -1
