# BlueMap Paper plugin configuration for the colo shard (C1-09).
# Terrain and live agent positions (ruling R38); no skins from Mojang. See plugins/bluemap/README.md.

# If the server should send player positions to the webapp (R38: the public map shows all agents live).
live-player-markers: true

# Download player skins from Mojang when a player joins. Must stay false: nothing is fetched for
# the map.
skin-download: false

# Players hidden in these game modes. Spectators are ghosts held by Paper (C2-02d) and must never show.
hidden-game-modes: [
  "spectator"
]

# Hide vanished and invisible players. Spectators are ghosts held by Paper (C2-02d) and must never show.
hide-vanished: true
hide-invisible: true
hide-sneaking: false

# Players at or above this player count stop rendering updates (-1: never).
player-render-limit: -1
