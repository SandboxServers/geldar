# BlueMap webserver configuration for the colo shard (C1-09, C2-07m).
# The integrated webserver is ON (ruling R38) so the public map can show live agent positions. BlueMap 5.29's
# webserver.conf has no bind-address key (no `ip`), so it listens on the container interface; it is reachable only on
# the colo network because Paper publishes no port. bluemap-web proxies only /maps/*/live/* to it. See
# plugins/bluemap/README.md.

# With this setting you can enable the integrated webserver. Must stay true while the map shows live positions.
enabled: true

# The webroot that the rendered web app and tiles are written to, for bluemap-web to serve read-only.
webroot: "bluemap/web"

# The port bluemap-web proxies the live endpoints to (paper:8101). Never published to the host.
port: 8101