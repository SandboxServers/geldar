# BlueMap webserver configuration for the colo shard (C1-09).
# The integrated webserver is OFF. BlueMap 5.29's webserver.conf has no bind-address key (no `ip`), so an
# enabled server cannot be limited to loopback. Caddy (C2-04) serves the rendered webroot instead. See
# plugins/bluemap/README.md.

# With this setting you can disable the integrated webserver. Must stay false in the repo.
enabled: false

# The webroot that the rendered web app and tiles are written to, for Caddy to serve read-only.
webroot: "bluemap/web"

# The port value for C2-04 to read. Not opened by BlueMap while enabled is false.
port: 8100
