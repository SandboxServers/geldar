# BlueMap core configuration for the NeoForge shard (NF-BM-2).
# Terrain only, rendered inside the NeoForge server. See plugins/bluemap/README.md.
# No secrets, tokens or addresses belong in this file.

# Mojang client assets (textures, models). FALSE for this shard: the NeoForge node makes no resource download.
# The Paper shard's owner ruling (2026-11-11, C2-07o) covers Paper only and is not carried over here.
accept-download: false

# The directory where BlueMap keeps its render data, relative to the server directory.
data: "bluemap"

# Render threads: 1. The NeoForge container has 3 CPUs shared with the game tick; 0 would mean one thread per core.
render-thread-count: 1

# Full re-render interval in minutes. 0 disables it: no full render runs unless the owner asks for one.
full-update-interval: 0

# Region-file check interval in minutes (default 5). 30 keeps the region scan cheap on a shared node.
region-file-check-interval: 30

# bStats metrics send a request to an outside server. Off, so the map makes no outbound call.
metrics: false
