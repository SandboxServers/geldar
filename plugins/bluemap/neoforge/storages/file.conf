# BlueMap storage configuration for the NeoForge shard (NF-BM-2). The rendered map tiles are written under the webroot that Caddy
# serves read-only (deploy/caddy/map-neoforge.caddy). The key names follow BlueMap v5.29's default storages/file.conf as far as the
# researcher could read them; UNVERIFIED against the generated default (docs/runbooks/nf-extra-mods.md, UNVERIFIED section).

storage-type: file

# Where the tiles are written, relative to the server directory. Inside the webroot in webapp.conf.
root: "bluemap/web/maps"

# Compression of the tile files: gzip (BlueMap's default).
compression: gzip
