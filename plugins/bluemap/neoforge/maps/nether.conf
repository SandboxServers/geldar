# BlueMap map configuration: the nether, NeoForge shard (NF-BM-2).
# The world is read from the NeoForge data volume, read only. See plugins/bluemap/README.md.

world: "world"
dimension: "minecraft:the_nether"
dimension-type: "minecraft:the_nether"
name: "Nether"
sorting: 1
start-pos: { x: 0, z: 0 }
# bounds set by the owner/worldops. Default numbers: the render covers x -512..512, z -512..512 only.
min-pos: { x: -512, z: -512 }
max-pos: { x: 512, z: 512 }
sky-color: "#290000"
void-color: "#000000"
sky-light: 1
ambient-light: 0.1
remove-caves-below-y: -10000
cave-detection-ocean-floor: -5
cave-detection-uses-block-light: false
min-inhabited-time: 0
render-edges: true
edge-light-strength: 8
enable-perspective-view: true
enable-flat-view: true
enable-free-flight-view: true
enable-hires: true
storage: "file"
ignore-missing-light-data: false

# Static marker sets. None: no entity markers and no player markers. Dynamic markers from other
# plugins are not installed on this shard.
marker-sets: {
}
