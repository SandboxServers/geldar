# BlueMap webserver configuration for the NeoForge shard (NF-BM-2).
# The integrated webserver is OFF: Caddy serves the webroot files, so this server binds no port for the map.
# No live endpoint exists on this shard (no /maps/*/live/*), so nothing needs proxying.

# OFF. Must stay false: BlueMap's own server is not published and not bound.
enabled: false

# The webroot the rendered web app and tiles are written to, for the read-only Caddy container.
webroot: "bluemap/web"
