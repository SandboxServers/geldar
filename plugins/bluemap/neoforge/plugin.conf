# BlueMap plugin configuration for the NeoForge shard (NF-BM-2).
# Terrain only: no player is shown (no live markers, no skins, every game mode hidden).
# See plugins/bluemap/README.md.

# Send player positions to the webapp. OFF: the NeoForge map shows no player.
live-player-markers: false
# players.json is never written: BlueMap writes it only when write-players-interval is above 0.
write-players-interval: 0

# Download player skins from Mojang when a player joins. OFF: no skin fetch and no Mojang call for skins.
skin-download: false

# Players in these game modes are hidden. All four vanilla modes are listed, so no player is shown in any mode.
hidden-game-modes: [
  "spectator",
  "survival",
  "creative",
  "adventure"
]

# Hide vanished, invisible and sneaking players. All ON: a player in any of these states is never shown.
hide-vanished: true
hide-invisible: true
hide-sneaking: true

# Players at or above this player count stop rendering updates (-1: never).
player-render-limit: -1
