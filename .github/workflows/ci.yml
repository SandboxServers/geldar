# Runs on every PR and on main. `main` requires one check, `ci gate`, which
# passes only when every job below passed. A job whose part of the repo does
# not exist yet (plugin/, compose/) says so and passes; the packet that creates
# that part makes the job do real work. Mirrors `./geldar.ps1 check`, except
# the `sql` job, which has no local `check` counterpart.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typescript:
    name: typescript
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: lint (biome)
        run: pnpm lint
      - name: typecheck
        run: pnpm typecheck
      - name: test (vitest)
        run: pnpm test
      - name: repo checks (line caps, line endings, control characters)
        run: pnpm check:repo
      - name: generated code is up to date (contract drift)
        run: pnpm check:generated
      - name: geldar.ps1 runs on Linux
        run: pwsh -NoProfile -File ./geldar.ps1 pnpm --version

  plugin:
    name: plugin
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: plugin/ does not exist yet
        if: hashFiles('plugin/build.gradle.kts') == ''
        run: echo "No plugin/build.gradle.kts yet; nothing to build."
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: hashFiles('plugin/build.gradle.kts') != ''
        with:
          distribution: temurin
          java-version-file: plugin/.java-version
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: hashFiles('plugin/build.gradle.kts') != ''
      - name: gradle build
        if: hashFiles('plugin/build.gradle.kts') != ''
        working-directory: plugin
        run: ./gradlew build --no-daemon

  compose:
    name: compose
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shard secrets (phase0)
        shell: bash
        run: pwsh -NoProfile -File ./geldar.ps1 shard secrets phase0
      - name: docker compose config
        shell: bash
        run: |
          shopt -s nullglob
          files=(compose/*.yml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No compose/*.yml yet; nothing to validate."
            exit 0
          fi
          # .env is gitignored; validate against the committed defaults.
          if [ -f compose/.env.example ] && [ ! -f compose/.env ]; then
            cp compose/.env.example compose/.env
          fi
          # Overlays (rcon-host.yml, nats-auth.yml) only add to a base file, so each is checked merged
          # with its base, the same chains as ./geldar.ps1 check.
          for f in "${files[@]}"; do
            case "$(basename "$f")" in rcon-host.yml|nats-auth.yml|nats-auth-mcp.yml|colo-public.yml) continue ;; esac
            echo "::group::$f"
            docker compose -f "$f" config --quiet
            echo "::endgroup::"
          done
          echo "::group::colo.yml with nats-auth.yml and colo-public.yml (dummy bind and port)"
          GELDAR_MC_BIND=127.0.0.1 GELDAR_MC_PORT=2 docker compose -f compose/colo.yml -f compose/nats-auth.yml -f compose/colo-public.yml config --quiet
          echo "::endgroup::"
          echo "::group::phase0.yml with rcon-host.yml"
          docker compose -f compose/phase0.yml -f compose/rcon-host.yml config --quiet
          echo "::endgroup::"
          echo "::group::phase0.yml with mcp.yml and nats-auth.yml"
          docker compose -f compose/phase0.yml -f compose/mcp.yml -f compose/nats-auth.yml -f compose/nats-auth-mcp.yml config --quiet
          echo "::endgroup::"
      - name: caddy validate (public site files)
        shell: bash
        run: bash deploy/caddy/validate.sh

  sql:
    name: sql
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s
          --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: wait for postgres
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U postgres; then exit 0; fi
            sleep 2
          done
          echo "::error::postgres did not become ready"
          exit 1
      - name: apply migrations in name order
        env:
          PGPASSWORD: ci
        run: |
          shopt -s nullglob
          files=(sql/[0-9]*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no sql/[0-9]*.sql migrations found"
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "::group::$f"
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$f"
            echo "::endgroup::"
          done
      - name: check schema (Appendix D tables and pgvector)
        env:
          PGPASSWORD: ci
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f sql/test/check-schema.sql

  images:
    name: images
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build eventsink (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          file: eventsink/Dockerfile
          push: false
          provenance: false
          cache-from: type=gha,scope=eventsink
          cache-to: type=gha,mode=max,scope=eventsink
      - name: build threshold/mcp (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          file: threshold/mcp/Dockerfile
          push: false
          provenance: false
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,mode=max,scope=mcp

  integration:
    name: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_DB: geldar
          POSTGRES_USER: geldar
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U geldar -d geldar" --health-interval 2s
          --health-timeout 5s --health-retries 30
    env:
      GELDAR_IT: '1'
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: apply migrations in name order
        env:
          PGPASSWORD: ci
        run: |
          shopt -s nullglob
          files=(sql/[0-9]*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no sql/[0-9]*.sql migrations found"
            exit 1
          fi
          for f in "${files[@]}"; do
            psql -h 127.0.0.1 -U geldar -d geldar -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: password file the integration cases read (CI only; the shard writes its own)
        run: |
          mkdir -p compose/secrets
          printf '%s' ci > compose/secrets/postgres.txt
      - name: NATS server with JetStream for the NATS integration tests (127.0.0.1:4222)
        run: |
          docker run -d --name geldar-ci-nats -p 127.0.0.1:4222:4222 -p 127.0.0.1:8222:8222 \
            nats:2.15.1-alpine@sha256:7ae34c25dfd6fe2e01c6483eabef20d796690fdcac6c4d94ca780a6cf9877fde -js -m 8222
      - name: wait for NATS
        run: |
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8222/healthz > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "::error::nats-server did not become ready"
          docker logs geldar-ci-nats
          exit 1
      - name: start the eventsink (it creates GELDAR_EVENTS and its consumer, as in compose)
        env:
          GELDAR_NATS_URL: nats://127.0.0.1:4222
          POSTGRES_PASSWORD_FILE: compose/secrets/postgres.txt
        run: |
          node eventsink/src/main.ts > "$RUNNER_TEMP/eventsink.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/eventsink.pid"
      - name: wait for the eventsink to be consuming GELDAR_EVENTS
        run: |
          pid=$(cat "$RUNNER_TEMP/eventsink.pid")
          for _ in $(seq 1 60); do
            if grep -q 'consuming GELDAR_EVENTS' "$RUNNER_TEMP/eventsink.log"; then
              echo "eventsink is consuming GELDAR_EVENTS"
              exit 0
            fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 1
          done
          echo "::error::eventsink did not start"
          cat "$RUNNER_TEMP/eventsink.log"
          exit 1
      - name: integration tests that need Postgres or NATS
        env:
          # CI-only: the guard allows the shared geldar database only on GitHub Actions with this set.
          GELDAR_IT_ALLOW_SHARED_DB: '1'
        run: >-
          pnpm vitest run
          threshold/mcp/test/it/pg-stores.it.test.ts
          threshold/mcp/test/it/sleep-marks-grants.it.test.ts
          threshold/mcp/test/it/pg-migrate.it.test.ts
          threshold/mcp/test/it/scram-login.it.test.ts
          threshold/mcp/test/it/schema-check.it.test.ts
          threshold/mcp/test/it/append-only.it.test.ts
          tools/mcp-tokens/test/cli.it.test.ts
          tools/mcp-tokens/test/owner-cap.it.test.ts
          animus/src/memory/memory.it.test.ts
          glass/test/glass.it.test.ts
          tools/adam-report/test/report.it.test.ts
          animus/src/link/link.it.test.ts
          eventsink/test/eventsink.it.test.ts
          eventsink/test/projection.it.test.ts
          golem/src/mind-link/server.it.test.ts
          threshold/mcp/test/nats-auth.it.test.ts
      - name: stop the eventsink and show its log
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/eventsink.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/eventsink.pid")" 2>/dev/null || true
          fi
          cat "$RUNNER_TEMP/eventsink.log" 2>/dev/null || true

  gate:
    name: ci gate
    if: always()
    needs: [typescript, plugin, compose, sql, images, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::a required job did not succeed ($r)"
              exit 1
            fi
          done
