# Runs on every PR and on main. `main` requires one check, `ci gate`, which
# passes only when every job below passed. A job whose part of the repo does
# not exist yet (plugin/, compose/) says so and passes; the packet that creates
# that part makes the job do real work. Mirrors `./geldar.ps1 check`.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typescript:
    name: typescript
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: lint (biome)
        run: pnpm lint
      - name: typecheck
        run: pnpm typecheck
      - name: test (vitest)
        run: pnpm test
      - name: repo checks (line caps, LF line endings)
        run: pnpm check:repo
      - name: generated code is up to date (contract drift)
        run: pnpm check:generated
      - name: geldar.ps1 runs on Linux
        run: pwsh -NoProfile -File ./geldar.ps1 pnpm --version

  plugin:
    name: plugin
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: plugin/ does not exist yet
        if: hashFiles('plugin/build.gradle.kts') == ''
        run: echo "No plugin/build.gradle.kts yet; nothing to build."
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: hashFiles('plugin/build.gradle.kts') != ''
        with:
          distribution: temurin
          java-version-file: plugin/.java-version
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: hashFiles('plugin/build.gradle.kts') != ''
      - name: gradle build
        if: hashFiles('plugin/build.gradle.kts') != ''
        working-directory: plugin
        run: ./gradlew build --no-daemon

  compose:
    name: compose
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: docker compose config
        shell: bash
        run: |
          shopt -s nullglob
          files=(compose/*.yml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No compose/*.yml yet; nothing to validate."
            exit 0
          fi
          # .env is gitignored; validate against the committed defaults.
          if [ -f compose/.env.example ] && [ ! -f compose/.env ]; then
            cp compose/.env.example compose/.env
          fi
          for f in "${files[@]}"; do
            echo "::group::$f"
            docker compose -f "$f" config --quiet
            echo "::endgroup::"
          done

  gate:
    name: ci gate
    if: always()
    needs: [typescript, plugin, compose]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::a required job did not succeed ($r)"
              exit 1
            fi
          done
