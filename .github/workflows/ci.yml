# Runs on every PR, on main, and on every merge queue entry (merge_group, decision 0220). `main` requires one
# check, `ci gate`, which passes only when every job below passed. merge_group has no paths filter, so the
# queue always runs the whole suite. A job whose part of the repo does
# not exist yet (plugin/, compose/) says so and passes; the packet that creates
# that part makes the job do real work. Mirrors `./geldar.ps1 check`, except
# the `sql` job, which has no local `check` counterpart.
name: ci

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typescript:
    name: typescript
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: lint (biome)
        run: pnpm lint
      - name: typecheck
        run: pnpm typecheck
      - name: test (vitest)
        run: pnpm test
      - name: repo checks (line caps, line endings, control characters)
        run: pnpm check:repo
      - name: generated code is up to date (contract drift)
        run: pnpm check:generated
      - name: geldar.ps1 runs on Linux
        run: pwsh -NoProfile -File ./geldar.ps1 pnpm --version

  plugin:
    name: plugin
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: plugin/ does not exist yet
        if: hashFiles('plugin/build.gradle.kts') == ''
        run: echo "No plugin/build.gradle.kts yet; nothing to build."
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: hashFiles('plugin/build.gradle.kts') != ''
        with:
          distribution: temurin
          java-version-file: plugin/.java-version
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: hashFiles('plugin/build.gradle.kts') != ''
      - name: gradle build
        if: hashFiles('plugin/build.gradle.kts') != ''
        working-directory: plugin
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2; do
            ./gradlew build --no-daemon 2>&1 | tee "$RUNNER_TEMP/gradle-plugin.log" && exit 0
            if grep -Eqi 'Dependency verification failed' "$RUNNER_TEMP/gradle-plugin.log"; then exit 1; fi
            if [ "$attempt" = 2 ] || ! grep -Eqi 'HTTP (429|50[0-9])|Could not (GET|HEAD) |Could not find [A-Za-z0-9_.-]+:[A-Za-z0-9_.-]+:[A-Za-z0-9_.-]+|Read timed out|Connect(ion)? (reset|timed out)|Premature end of Content-Length|Received status code (429|50[0-9])' "$RUNNER_TEMP/gradle-plugin.log"; then exit 1; fi
            echo "::warning::network error in the plugin build; retrying once"
            sleep 30
          done

  # neoforge/ (the progression mod) and neoforge-ledger/ (the telemetry adapter; it consumes plugin/ledger-core as a
  # composite build) are separate Gradle builds. Not path filtered: a skipped job is not "success", so the gate would
  # fail, and merge_group has no paths filter anyway. Dependency verification stays on (gradle/verification-metadata.xml
  # in each build); locks are never rewritten here. No server start. The build is retried once, and only when the log
  # shows a network error (never for a test failure). Gradle's dependency cache is kept by setup-gradle, as in `plugin`.
  neoforge:
    name: neoforge
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: gradle build (neoforge)
        working-directory: neoforge
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2; do
            ./gradlew build --no-daemon 2>&1 | tee "$RUNNER_TEMP/gradle-neoforge.log" && exit 0
            if grep -Eqi 'Dependency verification failed' "$RUNNER_TEMP/gradle-neoforge.log"; then exit 1; fi
            if [ "$attempt" = 2 ] || ! grep -Eqi 'HTTP (429|50[0-9])|Could not (GET|HEAD) |Could not find [A-Za-z0-9_.-]+:[A-Za-z0-9_.-]+:[A-Za-z0-9_.-]+|Read timed out|Connect(ion)? (reset|timed out)|Premature end of Content-Length|Received status code (429|50[0-9])' "$RUNNER_TEMP/gradle-neoforge.log"; then exit 1; fi
            echo "::warning::network error in the neoforge build; retrying once"
            sleep 30
          done
      - name: gradle build (neoforge-ledger)
        working-directory: neoforge-ledger
        shell: bash
        run: |
          set -o pipefail
          for attempt in 1 2; do
            ./gradlew build --no-daemon 2>&1 | tee "$RUNNER_TEMP/gradle-ledger.log" && exit 0
            if grep -Eqi 'Dependency verification failed' "$RUNNER_TEMP/gradle-ledger.log"; then exit 1; fi
            if [ "$attempt" = 2 ] || ! grep -Eqi 'HTTP (429|50[0-9])|Could not (GET|HEAD) |Could not find [A-Za-z0-9_.-]+:[A-Za-z0-9_.-]+:[A-Za-z0-9_.-]+|Read timed out|Connect(ion)? (reset|timed out)|Premature end of Content-Length|Received status code (429|50[0-9])' "$RUNNER_TEMP/gradle-ledger.log"; then exit 1; fi
            echo "::warning::network error in the neoforge-ledger build; retrying once"
            sleep 30
          done
      # Per-module totals from the JUnit XML (tests, failures+errors, skipped) in the job summary. Informational only:
      # it never fails the job, so the gate semantics stay with the two build steps above.
      - name: test summary (neoforge)
        if: always()
        shell: bash
        run: |
          {
            echo '### neoforge test summary'
            echo '| module | tests | failed | skipped |'
            echo '|---|---|---|---|'
            for m in neoforge neoforge-ledger; do
              t=0; f=0; s=0
              for x in "$m"/build/test-results/test/*.xml; do
                [ -f "$x" ] || continue
                line=$(grep -m1 -o '<testsuite [^>]*' "$x" || true)
                n=$(echo "$line" | grep -o ' tests="[0-9]*"' | grep -o '[0-9]*' || echo 0)
                fl=$(echo "$line" | grep -o ' failures="[0-9]*"' | grep -o '[0-9]*' || echo 0)
                er=$(echo "$line" | grep -o ' errors="[0-9]*"' | grep -o '[0-9]*' || echo 0)
                sk=$(echo "$line" | grep -o ' skipped="[0-9]*"' | grep -o '[0-9]*' || echo 0)
                t=$((t + ${n:-0})); f=$((f + ${fl:-0} + ${er:-0})); s=$((s + ${sk:-0}))
              done
              echo "| $m | $t | $f | $s |"
              echo "$m: $t tests completed, $f failed, $s skipped"
            done
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: upload test reports (neoforge)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: neoforge-test-reports
          path: |
            neoforge/build/reports/tests
            neoforge/build/test-results
            neoforge-ledger/build/reports/tests
            neoforge-ledger/build/test-results
          if-no-files-found: ignore
          retention-days: 7

  compose:
    name: compose
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shard secrets (phase0)
        shell: bash
        run: pwsh -NoProfile -File ./geldar.ps1 shard secrets phase0
      - name: docker compose config
        shell: bash
        run: |
          shopt -s nullglob
          files=(compose/*.yml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No compose/*.yml yet; nothing to validate."
            exit 0
          fi
          # .env is gitignored; validate against the committed defaults.
          if [ -f compose/.env.example ] && [ ! -f compose/.env ]; then
            cp compose/.env.example compose/.env
          fi
          # Overlays (rcon-host.yml, nats-auth.yml) only add to a base file, so each is checked merged
          # with its base, the same chains as ./geldar.ps1 check.
          for f in "${files[@]}"; do
            case "$(basename "$f")" in rcon-host.yml|nats-auth.yml|nats-auth-mcp.yml|colo-public.yml|colo-kino.yml|colo-kino-session.yml|colo-notice.yml|nf-live-human.yml) continue ;; esac
            echo "::group::$f"
            docker compose -f "$f" config --quiet
            echo "::endgroup::"
          done
          # nf-live-human.yml refers to the nf network of nf-live.yml, so it is checked merged with it, not alone.
          echo "::group::nf-live.yml with nf-live-human.yml"
          docker compose -p geldar-nf -f compose/nf-live.yml -f compose/nf-live-human.yml config --quiet
          echo "::endgroup::"
          echo "::group::colo.yml with nats-auth.yml and colo-public.yml (dummy bind and port)"
          GELDAR_MC_BIND=127.0.0.1 GELDAR_MC_PORT=2 docker compose -f compose/colo.yml -f compose/nats-auth.yml -f compose/colo-public.yml config --quiet
          echo "::endgroup::"
          echo "::group::colo.yml with colo-kino.yml (dummy Kino NATS user)"
          GELDAR_KINO_NATS_USER=kino GELDAR_KINO_PUBLIC_ORIGIN=https://glass.example.test docker compose -f compose/colo.yml -f compose/colo-kino.yml config --quiet
          echo "::endgroup::"
          echo "::group::colo.yml with colo-kino.yml and colo-kino-session.yml (dummy origin)"
          GELDAR_KINO_NATS_USER=kino GELDAR_KINO_PUBLIC_ORIGIN=https://glass.example.test docker compose -f compose/colo.yml -f compose/colo-kino.yml -f compose/colo-kino-session.yml config --quiet
          echo "::endgroup::"
          echo "::group::colo.yml with nats-auth.yml and colo-notice.yml (dummy deploy password file)"
          notice_secrets=$RUNNER_TEMP/notice-secrets
          mkdir -p "$notice_secrets"
          printf '%s' ci > "$notice_secrets/nats-deploy.txt"
          GELDAR_SECRETS_DIR=$notice_secrets docker compose -f compose/colo.yml -f compose/nats-auth.yml -f compose/colo-notice.yml config --quiet
          echo "::endgroup::"
          echo "::group::phase0.yml with rcon-host.yml"
          docker compose -f compose/phase0.yml -f compose/rcon-host.yml config --quiet
          echo "::endgroup::"
          echo "::group::phase0.yml with mcp.yml and nats-auth.yml"
          docker compose -f compose/phase0.yml -f compose/mcp.yml -f compose/nats-auth.yml -f compose/nats-auth-mcp.yml config --quiet
          echo "::endgroup::"
      - name: caddy validate (public site files)
        shell: bash
        run: bash deploy/caddy/validate.sh
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: caddy adapt test (route order, header strip; fails if Docker is missing)
        env:
          GELDAR_REQUIRE_DOCKER: '1'
        run: pnpm --filter @geldar/repo-checks exec vitest run src/caddy-adapt.test.ts

  sql:
    name: sql
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s
          --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: wait for postgres
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U postgres; then exit 0; fi
            sleep 2
          done
          echo "::error::postgres did not become ready"
          exit 1
      - name: apply migrations in name order
        env:
          PGPASSWORD: ci
        run: |
          shopt -s nullglob
          files=(sql/[0-9]*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no sql/[0-9]*.sql migrations found"
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "::group::$f"
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$f"
            echo "::endgroup::"
          done
      - name: check schema (Appendix D tables and pgvector)
        env:
          PGPASSWORD: ci
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f sql/test/check-schema.sql -f sql/test/check-schema-register-reads.sql -f sql/test/check-schema-kino-functions.sql -f sql/test/check-schema-glass-journal.sql -f sql/test/check-schema-mcp-roster.sql -f sql/test/check-schema-admin-flag.sql -f sql/test/check-schema-token-lifecycle.sql -f sql/test/check-schema-body-ops.sql -f sql/test/check-schema-owner-keys.sql -f sql/test/check-schema-session-owner-keys.sql -f sql/test/check-schema-supervisor-display-name.sql -f sql/test/check-schema-owner-agents.sql -f sql/test/check-schema-operator-flags.sql -f sql/test/check-schema-event-stamp.sql -f sql/test/check-schema-event-trace.sql -f sql/test/check-schema-account-delete.sql -f sql/test/check-schema-character-sheet.sql -f sql/test/check-schema-character-audit.sql -f sql/test/check-schema-body-helper.sql -f sql/test/check-schema-turn-records.sql -f sql/test/check-schema-roster-auto.sql -f sql/test/check-schema-owner-export.sql -f sql/test/check-schema-owner-export-bounds.sql -f sql/test/check-schema-body-host.sql -f sql/test/check-schema-skin-uploads.sql -f sql/test/check-schema-skin-rules.sql -f sql/test/check-schema-mc-ownership.sql

  images:
    name: images
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build eventsink (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          file: eventsink/Dockerfile
          push: false
          provenance: false
          cache-from: type=gha,scope=eventsink
          cache-to: type=gha,mode=max,scope=eventsink
      - name: build threshold/mcp (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          file: threshold/mcp/Dockerfile
          push: false
          provenance: false
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,mode=max,scope=mcp

  integration:
    name: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_DB: geldar
          POSTGRES_USER: geldar
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U geldar -d geldar" --health-interval 2s
          --health-timeout 5s --health-retries 30
    env:
      GELDAR_IT: '1'
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: apply migrations in name order
        env:
          PGPASSWORD: ci
        run: |
          shopt -s nullglob
          files=(sql/[0-9]*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no sql/[0-9]*.sql migrations found"
            exit 1
          fi
          for f in "${files[@]}"; do
            psql -h 127.0.0.1 -U geldar -d geldar -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: password file the integration cases read (CI only; the shard writes its own)
        run: |
          mkdir -p compose/secrets
          printf '%s' ci > compose/secrets/postgres.txt
      - name: NATS server with JetStream for the NATS integration tests (127.0.0.1:4222)
        run: |
          docker run -d --name geldar-ci-nats -p 127.0.0.1:4222:4222 -p 127.0.0.1:8222:8222 \
            nats:2.15.1-alpine@sha256:7ae34c25dfd6fe2e01c6483eabef20d796690fdcac6c4d94ca780a6cf9877fde -js -m 8222
      - name: wait for NATS
        run: |
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8222/healthz > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "::error::nats-server did not become ready"
          docker logs geldar-ci-nats
          exit 1
      - name: start the eventsink (it creates GELDAR_EVENTS and its consumer, as in compose)
        env:
          GELDAR_NATS_URL: nats://127.0.0.1:4222
          POSTGRES_PASSWORD_FILE: compose/secrets/postgres.txt
        run: |
          node eventsink/src/main.ts > "$RUNNER_TEMP/eventsink.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/eventsink.pid"
      - name: wait for the eventsink to be consuming GELDAR_EVENTS
        run: |
          pid=$(cat "$RUNNER_TEMP/eventsink.pid")
          for _ in $(seq 1 60); do
            if grep -q 'consuming GELDAR_EVENTS' "$RUNNER_TEMP/eventsink.log"; then
              echo "eventsink is consuming GELDAR_EVENTS"
              exit 0
            fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 1
          done
          echo "::error::eventsink did not start"
          cat "$RUNNER_TEMP/eventsink.log"
          exit 1
      - name: integration tests that need Postgres or NATS
        env:
          # CI-only: the guard allows the shared geldar database only on GitHub Actions with this set.
          GELDAR_IT_ALLOW_SHARED_DB: '1'
        run: >-
          pnpm vitest run
          threshold/mcp/test/it/pg-stores.it.test.ts
          threshold/mcp/test/it/sleep-marks-grants.it.test.ts
          threshold/mcp/test/it/pg-migrate.it.test.ts
          threshold/mcp/test/it/scram-login.it.test.ts
          threshold/mcp/test/it/schema-check.it.test.ts
          threshold/mcp/test/it/append-only.it.test.ts
          threshold/mcp/test/it/scratch-pool.it.test.ts
          tools/mcp-tokens/test/cli.it.test.ts
          tools/mcp-tokens/test/owner-cap.it.test.ts
          animus/src/memory/memory.it.test.ts
          glass/test/glass.it.test.ts
          tools/adam-report/test/report.it.test.ts
          animus/src/link/link.it.test.ts
          eventsink/test/eventsink.it.test.ts
          eventsink/test/projection.it.test.ts
          eventsink/test/audit.it.test.ts
          eventsink/test/xp.it.test.ts
          eventsink/test/state.it.test.ts
          golem/src/mind-link/server.it.test.ts
          threshold/mcp/test/nats-auth.it.test.ts
      - name: xp outbox integration test (serial)
        # Its own step, after the parallel one: the publisher claims every unpublished outbox row in the shared
        # database, so it must not run beside xp.it.test.ts, which leaves unpublished rows.
        env:
          GELDAR_IT_ALLOW_SHARED_DB: '1'
        run: pnpm vitest run eventsink/test/xp-outbox.it.test.ts
      - name: stop the eventsink and show its log
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/eventsink.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/eventsink.pid")" 2>/dev/null || true
          fi
          cat "$RUNNER_TEMP/eventsink.log" 2>/dev/null || true

  gate:
    name: ci gate
    if: always()
    needs: [typescript, plugin, neoforge, compose, sql, images, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::a required job did not succeed ($r)"
              exit 1
            fi
          done
