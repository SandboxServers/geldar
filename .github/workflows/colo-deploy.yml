# Deploys the Colo node once the colo-images workflow has published a commit's images (CD-2b, decision 0084).
# The job runs only on the self-hosted runner `geldar-colo-deploy`, whose user `ghdeploy` is unprivileged. Its one
# privileged action is `sudo -n /usr/local/libexec/geldar-deploy/run {plan|deploy} <sha>`. The root-owned entrypoint
# refuses any sha not reachable from main, reads the release manifest from the inbox, fetches main itself and runs
# deploy/colo-cd.sh from its own verified export. So a workflow on any branch can reach the runner label, but it can
# deploy only main. This job checks out no repository code. Runbook: docs/runbooks/colo-deploy.md.
name: colo-deploy

on:
  workflow_run:
    workflows: [colo-images]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit to deploy: 40 lowercase hex, on main. Empty: the head of main.'
        required: false
        type: string
        default: ''
      plan_only:
        description: 'Print the plan and stop; do not deploy.'
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  deploy:
    name: deploy the Colo
    if: >-
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository) ||
      github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, geldar-colo-deploy]
    environment: colo
    concurrency:
      group: colo-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      checks: read
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: resolve the commit and the colo-images run that built it
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SHA: ${{ inputs.sha }}
          INPUT_PLAN_ONLY: ${{ inputs.plan_only }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The runner has no GitHub CLI: the REST API is called with curl, and jq reads the reply.
          # The token goes in the Authorization header only; it is never printed.
          api() {
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/$1"
          }
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            sha="$WORKFLOW_RUN_SHA"
            run_id="$WORKFLOW_RUN_ID"
            plan_only=false
          else
            plan_only="${INPUT_PLAN_ONLY:-false}"
            sha="$INPUT_SHA"
            if [[ -z "$sha" ]]; then
              sha="$(api "commits/main" | jq -r '.sha')"
            fi
            if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::not a full commit sha: $sha" >&2
              exit 1
            fi
            # compare/main...<sha>: "identical" means main is at sha; "behind" means sha is an ancestor of main.
            # Any other status ("ahead", "diverged") means sha is not on main.
            status="$(api "compare/main...$sha" | jq -r '.status')"
            if [[ "$status" != "identical" && "$status" != "behind" ]]; then
              echo "::error::$sha is not on main (compare status: $status); refusing to deploy it" >&2
              exit 1
            fi
            # The images must exist before the node pulls them: the successful colo-images run for this commit.
            run_id="$(api "actions/workflows/colo-images.yml/runs?head_sha=$sha&branch=main&status=success&per_page=1" | jq -r '.workflow_runs[0].id // empty')"
            if [[ -z "$run_id" ]]; then
              echo "::error::no successful colo-images run for $sha on main; the images must be published first" >&2
              exit 1
            fi
          fi
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ || ! "$run_id" =~ ^[0-9]+$ ]]; then
            echo "::error::bad sha or run id" >&2
            exit 1
          fi
          {
            echo "sha=$sha"
            echo "run_id=$run_id"
            echo "plan_only=$plan_only"
          } >> "$GITHUB_OUTPUT"

      - name: download the release manifest of that colo-images run
        # The artifact blob host can time out from the node, so this is curl with time limits and retries, a digest check,
        # and a fallback to the check-run annotation (release.env, title release.env) of the manifest job of that run, which
        # comes through api.github.com. A digest mismatch is fatal with no fallback. Both sources are the same run under the
        # same token; the entrypoint still verifies the sha is on main and the image prefix and revision labels. The logic is
        # inline because this job checks out no repository code. deploy/test/colo-fetch-manifest.test.ts runs this block.
        timeout-minutes: 5
        env:
          REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.target.outputs.run_id }}
          OUT: ${{ runner.temp }}/release-manifest/release.env
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$OUT")"
          repo="$REPO"
          run_id="$RUN_ID"
          out="$OUT"
          api_url="${GELDAR_API_URL:-https://api.github.com}"
          : "${GH_TOKEN:?GH_TOKEN is required}"

          if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
            echo "::error::bad run id" >&2
            exit 1
          fi

          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          api() {
            curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 60 --retry 4 --retry-all-errors --retry-delay 5 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$@"
          }

          valid_manifest() {
            [[ -s "$1" ]] && grep -Eq '^GELDAR_[A-Z_]+_IMAGE=' "$1"
          }

          unzip_one() {
            # $1 zip, $2 destination directory. unzip, then python3, then bsdtar: whichever the runner has.
            if command -v unzip >/dev/null 2>&1; then
              unzip -q -o "$1" -d "$2"
            elif command -v python3 >/dev/null 2>&1; then
              python3 -I -c 'import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])' "$1" "$2"
            else
              tar -xf "$1" -C "$2"
            fi
          }

          from_artifact() {
            local meta url digest actual attempt
            meta="$(api "$api_url/repos/$repo/actions/runs/$run_id/artifacts?name=release.env&per_page=1")" || return 1
            url="$(jq -r '[.artifacts[] | select(.name == "release.env" and (.expired | not))][0].archive_download_url // empty' <<<"$meta")"
            digest="$(jq -r '[.artifacts[] | select(.name == "release.env" and (.expired | not))][0].digest // empty' <<<"$meta")"
            if [[ -z "$url" ]]; then
              echo "no release.env artifact in the run" >&2
              return 1
            fi
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "the API reports no sha256 digest for the artifact" >&2
              return 1
            fi
            for attempt in 1 2 3; do
              rm -f "$work/a.zip"
              if api --output "$work/a.zip" "$url"; then
                actual="sha256:$(sha256sum "$work/a.zip" | cut -d' ' -f1)"
                if [[ "$actual" != "$digest" ]]; then
                  echo "artifact digest mismatch (expected $digest, got $actual)" >&2
                  return 2
                fi
                rm -rf "$work/x"
                mkdir "$work/x"
                unzip_one "$work/a.zip" "$work/x" || return 1
                valid_manifest "$work/x/release.env" || return 1
                cat "$work/x/release.env" >"$out"
                return 0
              fi
              echo "artifact download attempt $attempt failed" >&2
            done
            return 1
          }

          from_annotation() {
            local jobs job_id notes
            jobs="$(api "$api_url/repos/$repo/actions/runs/$run_id/jobs?per_page=100")" || return 1
            job_id="$(jq -r '[.jobs[] | select(.name == "release manifest")][0].id // empty' <<<"$jobs")"
            if [[ ! "$job_id" =~ ^[0-9]+$ ]]; then
              echo "no release manifest job in the run" >&2
              return 1
            fi
            notes="$(api "$api_url/repos/$repo/check-runs/$job_id/annotations?per_page=100")" || return 1
            jq -r '[.[] | select(.title == "release.env")][0].message // empty' <<<"$notes" >"$work/note.env"
            valid_manifest "$work/note.env" || return 1
            cat "$work/note.env" >"$out"
          }

          rc=0
          from_artifact || rc=$?
          if [[ "$rc" == 0 ]]; then
            echo "release manifest fetched from the artifact"
          elif [[ "$rc" == 2 ]]; then
            # A digest mismatch is a tamper signal, not an outage: no fallback.
            echo "::error::the artifact does not match its digest; refusing to deploy" >&2
            exit 1
          elif from_annotation; then
            echo "release manifest fetched from the check-run annotation (artifact path failed)"
          else
            echo "::error::could not fetch the release manifest from the artifact or the annotation" >&2
            exit 1
          fi

      - name: write the release manifest into the inbox (atomic, mode 0600)
        env:
          INBOX: /var/lib/geldar-deploy/inbox
          SRC: ${{ runner.temp }}/release-manifest/release.env
        run: |
          set -euo pipefail
          if [[ ! -f "$SRC" ]]; then
            echo "::error::the artifact has no release.env" >&2
            exit 1
          fi
          if [[ ! -d "$INBOX" ]]; then
            echo "::error::the inbox is missing: $INBOX" >&2
            exit 1
          fi
          tmp="$(mktemp "$INBOX/.release.env.XXXXXX")"
          cat "$SRC" > "$tmp"
          chmod 0600 "$tmp"
          mv -f "$tmp" "$INBOX/release.env"
          echo "release manifest written to the inbox"

      - name: plan (the entrypoint prints it)
        env:
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          sudo -n /usr/local/libexec/geldar-deploy/run plan "$SHA" 2>&1 | tee "$RUNNER_TEMP/plan.log"

      - name: deploy (the entrypoint prints the log)
        if: steps.target.outputs.plan_only != 'true'
        env:
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          sudo -n /usr/local/libexec/geldar-deploy/run deploy "$SHA" 2>&1 | tee "$RUNNER_TEMP/deploy.log"

      - name: job summary (commit, plan, result, manual steps)
        if: always()
        env:
          SHA: ${{ steps.target.outputs.sha }}
          PLAN_ONLY: ${{ steps.target.outputs.plan_only }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -uo pipefail
          mode="plan and deploy"
          if [[ "$PLAN_ONLY" == "true" ]]; then mode="plan only"; fi
          {
            echo "## Colo deploy"
            echo ""
            echo "- Commit: \`$SHA\`"
            echo "- Mode: $mode"
            echo "- Result: $JOB_STATUS"
            echo ""
            echo "### Needs manual"
            echo ""
            echo "The pipeline does not apply plugin jar, Paper, Velocity, Caddy or NATS changes. An operator does those."
            echo ""
            manual="$(grep -h -i 'needs manual' "$RUNNER_TEMP/plan.log" "$RUNNER_TEMP/deploy.log" 2>/dev/null || true)"
            if [[ -n "$manual" ]]; then
              echo '```'
              echo "$manual"
              echo '```'
            else
              echo "None reported."
            fi
            echo ""
            echo "<details><summary>Plan</summary>"
            echo ""
            echo '```'
            cat "$RUNNER_TEMP/plan.log" 2>/dev/null || echo "no plan output"
            echo '```'
            echo "</details>"
            if [[ -f "$RUNNER_TEMP/deploy.log" ]]; then
              echo ""
              echo "<details><summary>Deploy log</summary>"
              echo ""
              echo '```'
              cat "$RUNNER_TEMP/deploy.log"
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
