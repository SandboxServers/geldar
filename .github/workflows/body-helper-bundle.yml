# C7-03c5: builds the body helper bundle (body-helper/dist/main.js) and its sha256 on a push to main that
# changes the helper, and on manual dispatch. It publishes the GitHub Actions artifact `body-helper-bundle`
# (kept 30 days): main.js and main.js.sha256. It also checks the pinned Node tarball (deploy/body-helper-node.env)
# against its sha256. It is build-only: no deploy, no node access, no secret reads. The install is a runbook step
# (docs/runbooks/body-helper-node-steps.md), run by geldar-93 on the node.
name: body-helper-bundle

on:
  push:
    branches: [main]
    paths:
      - body-helper/**
      - contract/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - deploy/body-helper-node.env
      - .github/workflows/body-helper-bundle.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: body-helper-bundle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  body-helper-bundle:
    name: build the body helper bundle
    if: github.repository == 'SandboxServers/geldar'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
      - name: check the pinned Node tarball against its sha256
        run: |
          set -euo pipefail
          . deploy/body-helper-node.env
          curl -fsSL -o node.tar.xz "https://nodejs.org/dist/v${BODY_HELPER_NODE_VERSION}/${BODY_HELPER_NODE_TARBALL}"
          echo "${BODY_HELPER_NODE_SHA256_LINUX_X64}  node.tar.xz" | sha256sum --check
      - name: install
        run: pnpm install --frozen-lockfile --filter @geldar/body-helper...
      - name: build the bundle
        run: pnpm --filter @geldar/body-helper build
      - name: self-check the digest
        run: |
          set -euo pipefail
          (cd body-helper/dist && sha256sum --check main.js.sha256)
      - name: upload body-helper-bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: body-helper-bundle
          path: body-helper/dist/
          retention-days: 30
          if-no-files-found: error
