# Builds the mcp-mock image, runs the image test against the loaded image, and only then
# pushes :main and :sha-<commit> to GHCR on main (never on pull requests or other refs). The first push
# creates a private package; making it public is an owner action, not done here.
# Unsigned, no SBOM, no provenance attestation (owner ruling).
name: mcp-mock-image

on:
  pull_request:
    paths:
      - threshold/mcp-mock/**
      - contract/**
      - package.json
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - .nvmrc
      - .github/workflows/mcp-mock-image.yml
  push:
    branches: [main]
    paths:
      - threshold/mcp-mock/**
      - contract/**
      - package.json
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - .nvmrc
      - .github/workflows/mcp-mock-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-mock-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build (loaded locally, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: threshold/mcp-mock/Dockerfile
          load: true
          provenance: false
          tags: |
            ghcr.io/sandboxservers/geldar-mcp-mock:main
            ghcr.io/sandboxservers/geldar-mcp-mock:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: image test
        env:
          GELDAR_IMAGE_TESTS: '1'
          MOCK_IMAGE: ghcr.io/sandboxservers/geldar-mcp-mock:main
        run: pnpm vitest run threshold/mcp-mock/src/image.test.ts
      # Everything below runs only after the test passed: a failing test never publishes.
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: push (rebuilds from the cache the tested build wrote)
        id: push
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: threshold/mcp-mock/Dockerfile
          push: true
          provenance: false
          tags: |
            ghcr.io/sandboxservers/geldar-mcp-mock:main
            ghcr.io/sandboxservers/geldar-mcp-mock:sha-${{ github.sha }}
          cache-from: type=gha
      - name: write the digest to the step summary
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "digest $DIGEST" >> "$GITHUB_STEP_SUMMARY"
