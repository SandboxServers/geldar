# Security updates only. Every dependency, action and image is pinned on
# purpose (docs/decisions/0005-pinning-and-security-updates.md), so routine
# version-update PRs are switched off with open-pull-requests-limit: 0.
# Dependabot *security* updates are enabled in the repo settings and still open
# PRs for known vulnerabilities; the entries below give those PRs a prefix and
# labels. Add an entry when a packet creates a new ecosystem.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(security)"
    labels: [dependencies, security]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(security)"
    labels: [dependencies, security]

  - package-ecosystem: docker
    directory: /compose
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(security)"
    labels: [dependencies, security]

  # Dependabot's docker-compose ecosystem reads only files named docker-compose.yml or compose.yml;
  # compose/phase0.yml is not, so its image digests are not updated (see docs/analysis/phase0/worknotes/fix-f.md).
  - package-ecosystem: docker-compose
    directory: /compose
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(security)"
    labels: [dependencies, security]

  - package-ecosystem: docker
    directory: /threshold/mcp
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(security)"
    labels: [dependencies, security]

  - package-ecosystem: docker
    directory: /threshold/mcp-mock
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(security)"
    labels: [dependencies, security]

  - package-ecosystem: gradle
    directory: /plugin
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(security)"
    labels: [dependencies, security]

  - package-ecosystem: docker
    directory: /eventsink
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(security)"
    labels: [dependencies, security]
