# Colo Mind shard file: what the colo containers read (golem-body and animus), decisions 0078, 0131.
# Mounted into golem-body, animus, geldar-mcp and players-host as /opt/geldar/shards/colo.yaml (compose/colo.yml).
# Derived from shards/phase0.yaml: the same blocks, with `sovereign` (C1-11a: the MCP and the player host read it).
# The flat budget file shards/colo.yaml is NOT this file: geldar.ps1 refuses unknown keys in it, so the blocks
# cannot live there.
# Every address is a colo compose service name or loopback. The Thinker is an explicit placeholder (see mind.thinker).
shard: colo
seed: 8675309                    # compose/colo.yml paper SEED must equal this; keep them equal
tick_rate: 20                    # 20 TPS is the gate (decisions 0038 and 0047)
world_border_radius: 9500        # colo only: diameter 19000 in the world border command (moved 2026-11-15, spawn-town cutover)
# The largest limits an intent may ask for: the output validator's bounds (animus validate/bounds.ts).
max_world_ticks: 240000          # limits.max_world_ticks of an intent; the contract's own cap
max_block_operations: 10000      # limits.max_block_operations of an intent; the contract's own cap
population_target: 1
identity_mode: watched           # unwatched | watched
reflexes:                        # one flag per spec 5.2 reflex; enabled: false turns all off
  enabled: true
  eat: true
  retreat: true
  hazard_escape: true
  fall_stop: true
  fight_or_flee: true
  blocked_path: true
  panic_burrow: true
  dark_shelter: false            # off 2026-11-27 (owner): the body keeps working in the dark; retreat/fight_or_flee/panic_burrow still protect it
chat: { radius: 32, shout_enabled: false, rate_limit_seconds: 3, max_chars: 256 }
memory: { working_window: 20, episodic_top_k: 8, fatigue_days: 3 }
attention: { min_wakeup_spacing_s: 20, fallback_wakeup_ticks: 6000, overheard_to_digest: true }
lifecycle: { permadeath: false }
# building is on per decision record 0426; it needs the NATS body role for geldar-plans and geldar-seen (applied by hand on the node).
body_actions: { edit_sign: false, use: true, swim: false, building: true }  # the Body's verb flags, as phase0; use (decision 0218) is on for the colo Body
models:
  strong: ["qwen3:32b"]          # served by the Thinker pool (decision 0078); the same tags as phase0
  fast: ["qwen3:8b"]

# Public surfaces (decisions 0090, 0094; ruling R14, snake_case): the MCP and Glass sit behind the node's Caddy. Caddy
# runs on the host network and reaches the loopback publishes; it sets x-geldar-client-ip. The client address is read
# only from a peer in trusted_proxies. 127.0.0.1 is what Caddy looks like to a service that sees the real peer; if the
# docker proxy shows the bridge gateway instead, the live step in docs/analysis/phase1/worknotes/C2-07a2.md sets
# GELDAR_MCP_TRUSTED_PROXIES / GELDAR_GLASS_TRUSTED_PROXIES to that address. An unmatched peer is charged by its own address.
public:
  trusted_proxies: ["127.0.0.1"]
  client_ip_header: x-geldar-client-ip
  rate_limit:
    per_minute: 600
    burst: 120
  kill_switch: false
# Sovereign players (spec 5.15; decisions 0040, 0041, 0052), the phase0 values. `players` lists the rangers served on
# the colo (player_id, life_id, name); the owner adds one here first (Jason, C1-10a). players-host refuses an unlisted id,
# and colo-up whitelists every life_id on Paper (the in-game name) before any body starts.
sovereign:
  allowed: true
  harnesses:
    claude: { enabled: true }
    chatgpt: { enabled: true }   # decision 0180: the ChatGPT-subscription harness (Picard, kit rc16)
  owner_cap_default: 3
  owner_cap_owner: 20
  mcp:
    max_body_bytes: 65536
    port: 8788
    # Open requests per address and in total. Each Mind holds a `wait` (up to 240 s) plus GET streams; ~94 Minds
    # share one address and each POST takes an address slot and an owner slot (the owner slot uses this number too).
    max_connections_per_address: 512
    max_connections: 1024
    wait_cap_seconds: 240
    keepalive_seconds: 25
    max_result_bytes: 16384
    # The Colo Mind advertises only the tools it runs: offer, propose, vote and the other unavailable tools stay hidden.
    show_unavailable_tools: false
    trusted_proxies: []
    replay_minutes: 60
  wake:
    min_spacing_seconds: 30
    intent_run_too_long_seconds: 300
  presence:
    lease_seconds: 60
    hibernate_after_seconds: 600
    start: on_demand
  budget:
    credits_per_real_hour: 30
    cap_credits: 240
  rate_limits:
    calls_per_minute: 60
    act_min_seconds: 2
    say_min_seconds: 3
    journal_min_seconds: 5
    handshake_per_minute: 300
    owner_calls_per_minute: 600
    failed_auth_per_minute: 30
  players:
    - { player_id: ag-jason-01, life_id: ag_jason_01, name: Jason }
