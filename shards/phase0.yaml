# Phase 0 shard config: Appendix E trimmed to Phase 0 (spec 5.1, decision 0022).
# The economy, shrine, governance, sovereign and historian blocks arrive in later phases.
shard: phase0
seed: 8675309                    # compose/phase0.yml SEED must equal this; keep them equal
tick_rate: 20                    # dilation only after 5.14 tests pass
world_border_radius: 1500        # spec 5.1: diameter 3000 in the world border command
population_target: 1
reflexes:                        # one flag per spec 5.2 reflex; enabled: false turns all off
  enabled: true
  eat: true
  retreat: true
  hazard_escape: true
  fall_stop: true
  fight_or_flee: true
  blocked_path: true
  panic_burrow: true
chat: { radius: 32, shout_enabled: false, rate_limit_seconds: 3, max_chars: 256 }
memory: { working_window: 20, episodic_top_k: 8, fatigue_days: 3 }
attention: { min_wakeup_spacing_s: 20, fallback_wakeup_ticks: 6000, overheard_to_digest: true }
lifecycle: { permadeath: false }
models:
  strong: ["qwen3:32b"]          # Ollama on the host (decision 0002)
  fast: ["qwen3:8b"]

# The Mind (animus), the local Thinker and Adam's Body run as host processes (decision 0050); every
# address is loopback. Only the loaders of the packets that own a block read it; the reflex loader
# reads `reflexes` alone and ignores the rest.
mind:
  agent:
    name: Adam                   # display name in prompts and addressed-speech detection (decision 0051)
    username: ag_adam_01         # the game account username, equal to the life id (decision 0040, 0051)
    tier: strong                 # which models.* tier the life runs on; fixed for the life (spec 5.3.3)
    # Approved by the owner on 2026-11-09 (decision 0051 item 2). The Mind refuses to start if this
    # is empty or the draft placeholder.
    personality_seed: "Curious and patient; careful after dark; likes making things last and counting what he has; generous with neighbours but remembers who helped him; dry, understated humour. Quirk: he names the places he finds (the Long Ford, the Bent Oak) and uses those names later."
  thinker:
    host: 127.0.0.1              # the Mind's Thinker socket, loopback only
    port: 7410
    name: local                  # the Thinker name in the welcome frame
    heartbeat_s: 15              # seconds between heartbeat frames
    warm_timeout_s: 180          # seconds one pinned model may take to load before its warm-up fails (lantern-local)
  snapshot_retry_s: 60           # the Mind retries a snapshot request for this long while the Body is not up
  thinker_wait_s: 20             # a thought waits this long for a Thinker to connect, then retries once
  thought:
    max_tokens: 600             # output cap of a standard thought
    temperature: 0.7
    deadline_s: 25               # job deadline, seconds after dispatch
    reasoning: "off"             # the job's reasoning switch (decision 0049)
  reflection:
    max_tokens: 1200             # sleep reflection (spec 5.4)
    deadline_s: 180
    reasoning: "on"
  admission:
    max_thoughts_per_real_hour: 120   # local admission cap on thought jobs (wave 5 Q4)
  plan:
    expires_after_ticks: 1200    # a plan is refused by the Body this many world ticks after its snapshot
  run_tier: strong               # models.* tier for this run; the 8B run is a separate life (decision 0051)
  # The life id of each tier. `./geldar.ps1 adam up --model strong|fast` reads this table and sets
  # mind.agent.username, mind.agent.tier and mind.run_tier to match; the loaders ignore this key.
  lives: { strong: ag_adam_01, fast: ag_adam_02 }

# Pinned models (decision 0051). A model whose digest differs from the Ollama one is not advertised.
# The digests were recorded from Ollama by `./geldar.ps1 adam models --record` on 2026-11-09; the
# loaders refuse the literal placeholder `sha256:RECORD_AT_DISPATCH` outside tests.
model_pins:
  "qwen3:32b":
    digest: "sha256:030ee887880fc378860c2dd35101da424377520441ae4bfe7be6deff8ade7840"   # recorded from Ollama on 2026-11-09
    num_ctx: 8192                # context window sent as an Ollama option
    keep_alive: 30m              # how long Ollama keeps the model loaded
    max_concurrent: 1            # one job at a time per model
  "qwen3:8b":
    digest: "sha256:500a1f067a9f782620b40bee6f7b0c89e17ae61f686b92c24933e4ca4b2b8b41"   # recorded from Ollama on 2026-11-09
    num_ctx: 8192
    keep_alive: 30m
    max_concurrent: 1

embedding:
  model: nomic-embed-text        # decision D-P0-12
  digest: "sha256:0a109f422b47e3a30ba2b10eca18548e944e8a23073ee3f3e947efcf3c45e59f"     # recorded from Ollama on 2026-11-09
  dims: 768
  on_cpu: true                   # num_gpu 0, so it does not compete for the 24 GB card

# Sovereign players (spec 5.15; decisions 0040, 0041, 0052). The MCP (threshold/mcp) reads this block; the
# player hosts (golem/src/players) read `players`. Adam stays a headless local player (decision 0050).
sovereign:
  allowed: true                  # sovereign players may be served on this shard; false refuses every one (spec 5.15)
  harnesses:
    claude: { enabled: true }    # the harness types the MCP accepts; set enabled: false to pause that harness's players
  owner_cap_default: 3           # sovereign players one owner may hold on this shard (spec 5.15.6)
  owner_cap_owner: 20            # the owner's own cap (decision 0052); the owner's account name stays out of the repo
  mcp:
    port: 8788                   # plain HTTP; the compose overlay publishes only 127.0.0.1:<port>
    wait_cap_seconds: 240        # wait's max_seconds is clamped to this; the client's own timeout is 300 s
    keepalive_seconds: 25        # a notification on an open wait's stream, so the stream never idles past a proxy
    max_body_bytes: 65536        # the largest request body the MCP reads
    max_result_bytes: 16384      # the largest tool result, after trimming
    replay_minutes: 60           # how long a replayed or revoked token stays under watch
  wake:
    min_spacing_seconds: 30      # the least gap between two wakes of one player
    intent_run_too_long_seconds: 300  # an intent running longer than this wakes its player once
  presence:
    lease_seconds: 60            # a call or an open wait keeps a player awake for this long
    hibernate_after_seconds: 600 # after this long dim, the player hibernates and its Body goes down
    start: on_demand             # Bodies start on a first call or a presence up, never at boot
  budget:
    credits_per_real_hour: 30    # credits a life accrues per real hour (spec 5.7)
    cap_credits: 240             # the most credits a life can hold
  rate_limits:
    calls_per_minute: 60         # per player
    act_min_seconds: 2           # the least gap between two acts of one player
    say_min_seconds: 3           # the least gap between two says of one player
    owner_calls_per_minute: 600  # per owner
    failed_auth_per_minute: 30   # per client address; the global limit is 300 a minute, in code
  # Arrival is staggered (owner): Jason first, then Billy and Trini, then Zack and Kimberly, Tommy last.
  # The test player serves only the live cases. Life ids are the player ids with underscores.
  players:
    - { player_id: ag-jason-01, life_id: ag_jason_01, name: Jason }
    - { player_id: ag-billy-01, life_id: ag_billy_01, name: Billy }
    - { player_id: ag-trini-01, life_id: ag_trini_01, name: Trini }
    - { player_id: ag-zack-01, life_id: ag_zack_01, name: Zack }
    - { player_id: ag-kimberly-01, life_id: ag_kimberly_01, name: Kimberly }
    - { player_id: ag-tommy-01, life_id: ag_tommy_01, name: Tommy }
    - { player_id: ag-test-01, life_id: ag_test_01, name: Test }