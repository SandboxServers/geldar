# Geldar-Core settings. GELDAR_NATS_URL and GELDAR_SHARD in the environment override nats.url and shard.
# Phase 0 has one open NATS on the compose network; per-service accounts come later.
nats:
  url: nats://nats:4222
shard: phase0
queue:
  capacity: 10000
tps_interval_seconds: 20
recipes:
  # Recipes unlock through play (decision 0048). true grants every recipe on join, for a test shard only.
  grant_on_join: false
gravestones:
  # A stone-brick block with a sign where an agent character dies. No loot: drops are unchanged.
  enabled: true
  max_per_chunk: 4
lakitu:
  # The Lakitu camera feed (decision 0100). Off until the owner confirms decisions 0075 and 0077.
  # Values above their maximum are clamped at enable and logged once.
  enabled: false
  radius_chunks: 4
  max_sections_per_frame: 256
  max_updates_per_frame: 512
  max_panes_per_session: 4
  frame_hz: 5
kino:
  # The Kino data feed (decision 0075). Off by default; false is the kill switch.
  enabled: false
  # Horizontal view radius in chunks (1 to 8, default 5). Within 4 chunks, sections are read 6 above the agent and 1
  # below; beyond 4 chunks, 2 above and 2 below. Sections are read nearest-first.
  radius_chunks: 5
maintenance:
  # Server lines to the online players for a maintenance notice (CD-1), from geldar.<shard>.maintenance.
  # false turns the broadcast off; the file is re-read every 5 seconds, so no restart is needed.
  broadcast: true
blockowner:
  # Who placed the block that is there now, answered from CoreProtect (docs/runbooks/block-owner.md).
  # false stops the change listener and the query replies; the Body then reads every chunk as unknown.
  enabled: true
  # A CoreProtect lookup that runs longer than this answers an empty list with truncated true.
  lookup_timeout_ms: 2000
  # true logs at INFO one line per raw CoreProtect row for each chunk lookup, one summary per chunk and one per answer
  # (base owners, overlay change), at most 20 lines a minute. No player names. false (default) logs nothing extra.
  # Re-read every 5 seconds, so no restart is needed.
  debug: false
