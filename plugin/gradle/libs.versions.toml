# Exact pins only. Every version is at least two weeks old when it lands.
[versions]
paper = "26.1.2.build.74-stable"
jnats = "2.26.4"
gson = "2.14.0"
junit = "6.1.3"
json-schema-validator = "3.0.8"
velocity = "3.5.1"
coreprotect = "24.1"
# The BlueMap 5.29 runtime's API artifact (bluemap-core 5.29 depends on it); BlueMap has no separate 5.x API version.
bluemap-api = "2.8.2"
# BlueMap's Vector3d type (its HtmlMarker takes one). Compile-only: BlueMap provides it at runtime; a 2016 artifact.
flow-math = "1.0.3"
# Ledger (PT-03a): the OpenTelemetry API only (not relocated), and the spark API (compile-only). The Paper repository holds one spark-api build, 0.1-20240720.200737-2 (2024-07-20); Gradle's dependency lock records a timestamped snapshot as 0.1-SNAPSHOT, so that is the pin.
opentelemetry-api = "1.67.0"
spark-api = "0.1-SNAPSHOT"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
jnats = { module = "io.nats:jnats", version.ref = "jnats" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "json-schema-validator" }
velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity" }
coreprotect = { module = "net.coreprotect:coreprotect", version.ref = "coreprotect" }
bluemap-api = { module = "de.bluecolored:bluemap-api", version.ref = "bluemap-api" }
flow-math = { module = "com.flowpowered:flow-math", version.ref = "flow-math" }
opentelemetry-api = { module = "io.opentelemetry:opentelemetry-api", version.ref = "opentelemetry-api" }
spark-api = { module = "me.lucko:spark-api", version.ref = "spark-api" }
