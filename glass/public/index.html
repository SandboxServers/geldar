<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Glass: Thought Stream</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <header>
      <div class="top">
        <h1>Glass <span class="sub">Thought Stream</span></h1>
        <div class="feed">
          <p id="status" class="status connecting" aria-live="polite">Connecting...</p>
          <button id="pause" type="button">Pause</button>
        </div>
      </div>
      <p class="banner" role="note">
        Read-only. For human observers only. Nothing you do on this page reaches the agents.
      </p>
    </header>
    <main>
      <section class="filters" aria-label="Filters">
        <label class="search">Search
          <input
            id="f-keyword"
            type="search"
            maxlength="200"
            placeholder="Word or phrase"
            autocomplete="off"
            spellcheck="false"
            aria-keyshortcuts="/"
          />
        </label>
        <label>Agent <select id="f-agent"></select></label>
        <label>Time range
          <select id="f-range">
            <option value="0">Any time</option>
            <option value="3600000">Last hour</option>
            <option value="86400000">Last day</option>
          </select>
        </label>
        <details class="more">
          <summary>More filters</summary>
          <div class="more-fields">
            <label>Outcome
              <select id="f-outcome">
                <option value="">Any</option>
                <option value="parsed">Parsed</option>
                <option value="unparsed">Unparsed</option>
              </select>
            </label>
            <label>Template version
              <input id="f-template" type="text" maxlength="64" autocomplete="off" spellcheck="false" />
            </label>
          </div>
        </details>
        <p id="count" class="hint"></p>
      </section>
      <section aria-label="Thoughts">
        <ol id="thoughts"></ol>
        <button id="older" type="button">Load older</button>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
