<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kino</title>
    <!-- Where the sign-in page lives and where BlueMap's textures.json is served. Both are set per deploy. -->
    <meta name="kino-signin-url" content="/register/" />
    <meta name="kino-textures-url" content="" />
    <script type="importmap">
      { "imports": { "three": "/kino/vendor/three.module.js" } }
    </script>
    <style>
      html, body { margin: 0; height: 100%; background: #101418; color: #dde; font: 14px system-ui, sans-serif; }
      #bar { position: fixed; top: 0; left: 0; right: 0; display: flex; gap: 8px; padding: 6px; background: #000a; z-index: 1; }
      #bar a { color: #8cf; }
      #panes { position: fixed; inset: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); }
      .pane { position: relative; min-height: 200px; border: 1px solid #234; }
      .pane canvas { width: 100%; height: 100%; display: block; }
      .pane .tools { position: absolute; top: 40px; left: 6px; display: flex; gap: 4px; }
      .pane .msg { position: absolute; bottom: 6px; left: 6px; }
    </style>
  </head>
  <body>
    <div id="bar">
      <span id="notice"></span>
      <a id="signin" hidden>Sign in</a>
      <select id="picker" aria-label="Agent to watch"></select>
      <button id="open" type="button">Open pane</button>
    </div>
    <div id="panes"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
