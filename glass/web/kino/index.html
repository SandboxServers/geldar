<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kino</title>
    <!-- Where the sign-in page lives and where BlueMap's textures.json is served. The textures default is the BlueMap overworld map id (plugins/bluemap/config/maps/overworld.conf); change the content for another map id. -->
    <meta name="kino-signin-url" content="/register/" />
    <meta name="kino-textures-url" content="/kino/tex/maps/overworld/textures.json" />
    <script type="importmap">
      { "imports": { "three": "/kino/vendor/three.module.js" } }
    </script>
    <style>
      html, body { margin: 0; height: 100%; background: #101418; color: #dde; font: 14px system-ui, sans-serif; overflow-x: hidden; }
      body { display: flex; flex-direction: column; }
      #bar { flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 6px; background: #000a; box-sizing: border-box; max-width: 100%; }
      #bar a { color: #8cf; }
      #bar select, #bar button, .pane .tools button { min-height: 44px; min-width: 44px; padding: 0 12px; font-size: 16px; }
      #bar select { flex: 1 1 140px; min-width: 0; }
      #notice { flex: 1 1 100%; }
      #status { flex: 1 1 100%; font: 12px ui-monospace, monospace; color: #9ab; }
      #panes { flex: 1 1 0; min-height: 0; position: relative; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); }
      .pane { position: relative; min-height: 200px; min-width: 0; border: 1px solid #234; }
      .pane canvas { width: 100%; height: 100%; display: block; }
      .pane .tools { position: absolute; top: 6px; left: 6px; right: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
      .pane .msg { position: absolute; bottom: 28px; left: 6px; }
      .pane .status { position: absolute; bottom: 6px; left: 6px; right: 6px; font: 12px ui-monospace, monospace; color: #cde; text-shadow: 0 0 3px #000; }
      #bar select { max-width: 22rem; }
      #panes { overflow-y: auto; grid-auto-rows: minmax(240px, 1fr); }
      /* Wide screens with a mouse: one compact header row, smaller controls, a pane grid. */
      @media (min-width: 900px) and (pointer: fine) {
        #bar { flex-wrap: nowrap; gap: 12px; padding: 3px 8px; }
        #bar select, #bar button, .pane .tools button { min-height: 28px; min-width: 28px; padding: 0 10px; font-size: 13px; }
        #bar select { flex: 0 1 22rem; }
        #notice { flex: 0 1 auto; }
        #status { flex: 1 1 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #panes { grid-template-columns: repeat(auto-fit, minmax(min(560px, 100%), 1fr)); }
        .pane .tools { gap: 3px; }
      }
    </style>
  </head>
  <body>
    <div id="bar">
      <span id="notice"></span>
      <span id="status"></span>
      <a id="signin" hidden>Sign in</a>
      <select id="picker" aria-label="Agent to watch"></select>
      <button id="open" type="button">Open pane</button>
    </div>
    <div id="panes"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
