# Throwaway sign-facts check shard: one vanilla Paper server by default (no Velocity, NATS, plugins or secrets).
# Profile `core` adds geldar-core with a private NATS, for the bubble and proximity probes. See the runbook.
# Used only to check sign facts for edit_sign (golem/test/live/edit-sign.live.test.ts). See docs/runbooks/signcheck-shard.md.
# Run as its own project, on its own VM: docker compose -p geldar-signcheck -f compose/signcheck.yml up -d
# Delete with: docker compose -p geldar-signcheck down -v
# Profile `rcon` adds paper-rcon: the same Paper with RCON on, for the edit-sign live check fixture only.
# Never point GELDAR_WORLD_VOLUME at the Colo or phase0 world volume. The default profile has no secrets; the core
# and rcon profiles read one operator-made RCON password file (GELDAR_RCON_FILE, default compose/secrets/signcheck-rcon.txt).
name: geldar-signcheck

x-minecraft-healthcheck: &mc-health
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 10m

services:
  paper:
    image: itzg/minecraft-server:2026.10.1-java25@sha256:d12aed7e35981dfe259b60fbfee77d23a19b5898a7a31dca298d18b47b7b5776
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: "26.1.2"
      PAPER_BUILD: "74"
      MEMORY: "2G"
      ONLINE_MODE: "FALSE"
      ENABLE_WHITELIST: "FALSE"
      MAX_PLAYERS: "10"
      SPAWN_PROTECTION: "0"
      ENABLE_RCON: "FALSE"
    volumes:
      - paper-data:/data
    ports:
      # Game port on the host: 25570, bound to loopback (threat model section 1). Not the phase0 port (25565) or the Colo port.
      - "127.0.0.1:25570:25565"
    healthcheck:
      <<: *mc-health
      test: ["CMD", "mc-health"]
    restart: "no"
    mem_limit: 3g

  # Profile core only: NATS for geldar-core. Internal to the compose network, so no host ports.
  nats:
    profiles: [core]
    image: nats:2.15.1-alpine@sha256:7ae34c25dfd6fe2e01c6483eabef20d796690fdcac6c4d94ca780a6cf9877fde
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz?js-enabled-only=true"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: "no"

  # Profile core only: vanilla Paper with geldar-core, same image and world as `paper`. paper and paper-core share the
  # paper-data world volume, so run only one of them at a time: `up nats paper-core` and `up paper` must not overlap.
  # The jar is built from main (cd plugin; ./gradlew build) and copied to compose/plugins/geldar-core.jar, or set GELDAR_CORE_JAR.
  paper-core:
    profiles: [core]
    image: itzg/minecraft-server:2026.10.1-java25@sha256:d12aed7e35981dfe259b60fbfee77d23a19b5898a7a31dca298d18b47b7b5776
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: "26.1.2"
      PAPER_BUILD: "74"
      MEMORY: "2G"
      ONLINE_MODE: "FALSE"
      ENABLE_WHITELIST: "FALSE"
      MAX_PLAYERS: "10"
      SPAWN_PROTECTION: "0"
      ENABLE_RCON: "TRUE"
      RCON_PASSWORD_FILE: /run/secrets/rcon
      GELDAR_NATS_URL: nats://nats:4222
      GELDAR_SHARD: signcheck
    secrets: [rcon]
    volumes:
      - paper-data:/data
      - ${GELDAR_CORE_JAR:-./plugins/geldar-core.jar}:/plugins/geldar-core.jar:ro
    ports:
      # Loopback only, a separate port from paper (25570) so the two never claim the same host port.
      - "127.0.0.1:25571:25565"
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      <<: *mc-health
      # Same check as phase0 paper: healthy only when the server is up AND geldar-core is enabled in this process.
      test: ["CMD-SHELL", "mc-health && read -r pid start < /tmp/geldar-core.ready && [ -n \"$$start\" ] && [ \"$$(cut -d' ' -f22 /proc/$$pid/stat 2>/dev/null)\" = \"$$start\" ]"]
    restart: "no"
    mem_limit: 3g

  # Profile rcon only: vanilla Paper like `paper`, with RCON on. The edit-sign live check fixture uses it to place signs,
  # give items, teleport the two bots and restore the arena on this throwaway world. RCON is for that fixture only.
  # paper, paper-core and paper-rcon share the paper-data world volume, so only one of them runs at a time.
  paper-rcon:
    profiles: [rcon]
    image: itzg/minecraft-server:2026.10.1-java25@sha256:d12aed7e35981dfe259b60fbfee77d23a19b5898a7a31dca298d18b47b7b5776
    environment:
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: "26.1.2"
      PAPER_BUILD: "74"
      MEMORY: "2G"
      ONLINE_MODE: "FALSE"
      ENABLE_WHITELIST: "FALSE"
      MAX_PLAYERS: "10"
      SPAWN_PROTECTION: "0"
      ENABLE_RCON: "TRUE"
      RCON_PASSWORD_FILE: /run/secrets/rcon
    secrets: [rcon]
    volumes:
      - paper-data:/data
    ports:
      # Game port and RCON port, both on loopback only. Game port 25570 is the same host port as paper: they never run together.
      - "127.0.0.1:25570:25565"
      - "127.0.0.1:25575:25575"
    healthcheck:
      <<: *mc-health
      test: ["CMD", "mc-health"]
    restart: "no"
    mem_limit: 3g

secrets:
  # Used by paper-core and paper-rcon. The file is operator-made and gitignored (compose/secrets/). Create it before `up` with the core or rcon profile.
  rcon:
    file: ${GELDAR_RCON_FILE:-./secrets/signcheck-rcon.txt}

volumes:
  paper-data:
    name: ${GELDAR_WORLD_VOLUME:-geldar-signcheck_paper-data}
  nats-data:
