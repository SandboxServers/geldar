# OpenTelemetry Java agent profile for the live NeoForge shard (geldar-nf), agent 2.33.1.
# Derived from compose/paper/otel-agent.properties; same key names. Docs: docs/analysis/telemetry/nf-live-telemetry.md.
# Read ONLY when the agent is given OTEL_JAVAAGENT_CONFIGURATION_FILE (or otel.javaagent.configuration-file): the itzg
# JAVA_AGENTS variable passes a bare -javaagent with no options. Precedence: system property > environment > this file,
# so the entrypoint's OTEL_SDK_DISABLED=true (telemetry off) overrides otel.sdk.disabled below.
# No address, token or header lives here; the endpoint is the compose DNS name of the telemetry gateway.

# Everything auto-instrumented is off; only the OpenTelemetry API bridge (the ledger mod's instruments reach the agent
# through it) and the JVM runtime metrics are on.
otel.instrumentation.common.default-enabled=false
otel.instrumentation.opentelemetry-api.enabled=true
otel.instrumentation.runtime-telemetry.enabled=true

# Log appenders OFF on purpose (decision D-F): the server console log holds human names, chat lines and commands, and
# shipping it would put them in SigNoz. The ledger's own events do not use these appenders (they use the API's log bridge).
# Do not enable any of them here.
otel.instrumentation.log4j-appender.enabled=false
otel.instrumentation.logback-appender.enabled=false
otel.instrumentation.java-util-logging.enabled=false

# Resource providers that add identity are off (host, OS, process including the command line, args and owner, container id),
# so the resource keeps only service.name, service.namespace and geldar.shard (plus the SDK's telemetry.sdk.* labels).
# UNVERIFIED against 2.33.1 (the first live run settles it: the first exported batch must hold no host.name, host.id,
# process.* or os.* attribute): the provider class names in otel.java.disabled.resource.providers and the key
# otel.experimental.resource.disabled.keys. If a name is wrong the agent ignores it, which the first batch would show.
otel.java.disabled.resource.providers=io.opentelemetry.instrumentation.resources.HostResourceProvider,io.opentelemetry.instrumentation.resources.HostIdResourceProvider,io.opentelemetry.instrumentation.resources.OsResourceProvider,io.opentelemetry.instrumentation.resources.ProcessResourceProvider,io.opentelemetry.instrumentation.resources.ProcessRuntimeResourceProvider,io.opentelemetry.instrumentation.resources.ContainerResourceProvider
otel.experimental.resource.disabled.keys=host.name,host.id,host.arch,os.type,os.description,process.pid,process.command_line,process.command_args,process.executable.path,process.owner,container.id

# Only W3C trace context; no Baggage.
otel.propagators=tracecontext

# OTLP over HTTP to the telemetry gateway (Option A: the neoforge service joins the external network geldar-telemetry).
otel.exporter.otlp.protocol=http/protobuf
otel.exporter.otlp.endpoint=http://geldar-gateway:4318

# Resource: service.name is what the SigNoz NeoForge dashboard filters on; geldar.shard tells this shard from the others.
otel.service.name=geldar-neoforge
otel.resource.attributes=service.namespace=geldar,geldar.shard=nf

# The agent exports metrics and logs (ledger events are log records). Traces: none, because no auto-instrumentation is on,
# so no spans exist (this saves a queue).
otel.sdk.disabled=false
otel.metrics.exporter=otlp
otel.logs.exporter=otlp
otel.traces.exporter=none

# Periodic metric reader: 15 s.
otel.metric.export.interval=15000

# Batch log record processor: a bounded queue; a slow gateway drops records, it never grows memory.
otel.blrp.max.queue.size=2048
