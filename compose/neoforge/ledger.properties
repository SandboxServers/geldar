# Ledger config for the live NeoForge shard (geldar-nf): the neoforge-ledger mod reads it as config/ledger.properties,
# copied there by the entrypoint at every start (read at start only; a change needs a server restart).
# Keys are the ones neoforge-ledger really reads (neoforge-ledger/README.md); the Paper-only collectors (cadence, spark,
# census, bridge, container, disk, jfr) do not exist there and are not listed. No secret and no address lives here.
# Design: docs/analysis/telemetry/nf-live-telemetry.md. Rate limits and budgets stay at their defaults.

# Master switch. enabled=false stops every collector (the "ledger only" kill switch).
enabled=true

# Server health: tick lag, overruns, stalls, per-dimension tick time.
collector.tick.enabled=true
# Approximate loaded chunks, entities and players per dimension.
collector.world.enabled=true
# Players online, operators count, loaded-mods count, one config snapshot event at start (allow-listed keys only).
collector.server.enabled=true
# geldar.player.join and quit. An agent gets a life id and a session id; a human gets neither (no name, UUID or address).
collector.connections.enabled=true
# geldar.player.snapshot per online agent every 60 s (life id only).
collector.snapshot.enabled=true
# Advancements and the 300 s stats read, agents only.
collector.progress.enabled=true
# Block break/place, item craft/smelt, container open/close.
collector.curated.enabled=true

# Audit family. Console and RCON command events, combat and operator change.
collector.audit.enabled=true
collector.combat.enabled=true
collector.operator.enabled=true

# Chat export (geldar.chat) is OFF in the first live run, until the owner's explicit D-F decision record exists (human chat
# is human-written text; decision 0387 says nothing human-written is exported before that). The switch is added by a
# parallel change to neoforge-ledger (default false there too); until that lands the key is accepted and ignored.
# WARNING: in a ledger jar built BEFORE that change, collector.audit.enabled=true still exports chat text. Deploy this file
# only with a jar that has the collector.chat.enabled switch. Do not set it to true without the decision record.
collector.chat.enabled=false
