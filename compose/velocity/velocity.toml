# Velocity bot ingress for the Phase 0 shard (spec 5.1, decision 0021).
# Bots connect here in offline mode; Velocity forwards them to Paper with modern forwarding.
# The forwarding secret is the Docker secret file, shared with Paper's paper-global.yml.
config-version = "2.7"
bind = "0.0.0.0:25565"
motd = "Geldar bot ingress"
show-max-players = 400
online-mode = false
force-key-authentication = false
prevent-client-proxy-connections = false
player-info-forwarding-mode = "modern"
forwarding-secret-file = "/run/secrets/velocity-forwarding"
announce-forge = false
kick-existing-players = false
ping-passthrough = "DISABLED"
sample-players-in-ping = false
enable-player-address-logging = true

[servers]
# Paper is reachable only on the compose network.
paper = "paper:25565"
try = ["paper"]

[forced-hosts]

[advanced]
compression-threshold = 256
compression-level = -1
login-ratelimit = 3000
connection-timeout = 5000
read-timeout = 30000
haproxy-protocol = false
tcp-fast-open = false
bungee-plugin-message-channel = true
show-ping-requests = false
failover-on-unexpected-server-disconnect = true
announce-proxy-commands = true
log-command-executions = false
log-player-connections = true
accepts-transfers = false

[query]
enabled = false
port = 25565
map = "Velocity"
show-plugins = false
