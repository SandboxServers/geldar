# The Colo shard stack: the production Linux compose file for the shared node (decision 0082; plan C1).
# Standalone, not an overlay. Own network (geldar-colo), loopback binds only, CPU, memory, pids and log limits on every service.
# Start with: ./geldar.ps1 shard up colo. Each service's CPU and memory budget is set below as a literal default in
# `${GELDAR_COLO_<SERVICE>_CPUS:-x}` and `${GELDAR_COLO_<SERVICE>_MEM:-y}`. shards/colo.yaml holds the TOTAL cap for the
# shard; geldar.ps1 refuses a total below the sum of these defaults (Read-ColoConfig). `docker compose -f compose/colo.yml
# config` works offline with the defaults.
# The node also runs a production game server and CI runners: this file never publishes 25565 or 25566. Secrets: compose/secrets/ (`./geldar.ps1 shard secrets colo`).
name: geldar-colo

x-minecraft-healthcheck: &mc-health
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 10m

# Log rotation for every service (decision 0082): json-file, 10 MiB per file, 3 files.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Labels on every service (FX-WATCHTOWER): the opt-out keeps the node's Watchtower off these digest-pinned services (deploy/colo-up.sh updates them).
# com.geldar.stack names the stack; deploy/colo-status.sh still scopes its docker calls by the compose project label.
x-labels: &colo-labels
  com.centurylinklabs.watchtower.enable: "false"
  com.geldar.stack: colo

services:
  postgres:
    # Budget: 1 CPU, 2048m (no swap, 256 pids). Measured in C1-10.
    deploy:
      resources:
        limits:
          cpus: "${GELDAR_COLO_POSTGRES_CPUS:-1}"
          memory: "${GELDAR_COLO_POSTGRES_MEM:-2048m}"
          pids: 256
    memswap_limit: "${GELDAR_COLO_POSTGRES_MEM:-2048m}"
    pids_limit: 256
    logging: *logging
    labels: *colo-labels
    image: pgvector/pgvector:0.8.6-pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_DB: geldar
      POSTGRES_USER: geldar
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres
    secrets: [postgres]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Applied in name order on a fresh volume only (sql/README.md).
      - ../sql:/docker-entrypoint-initdb.d:ro
    # No ports: the colo services reach Postgres on the colo network only (no host publication).
    networks: [colo]
    healthcheck:
      # -h 127.0.0.1: during first-boot init Postgres listens only on its socket.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "geldar", "-d", "geldar"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  nats:
    # Budget: 0.5 CPU, 512m (no swap, 256 pids). Measured in C1-10.
    deploy:
      resources:
        limits:
          cpus: "${GELDAR_COLO_NATS_CPUS:-0.5}"
          memory: "${GELDAR_COLO_NATS_MEM:-512m}"
          pids: 256
    memswap_limit: "${GELDAR_COLO_NATS_MEM:-512m}"
    pids_limit: 256
    logging: *logging
    labels: *colo-labels
    image: nats:2.15.1-alpine@sha256:7ae34c25dfd6fe2e01c6483eabef20d796690fdcac6c4d94ca780a6cf9877fde
    # NATS accounts are the opt-in overlay (decision 0080); see the nats-auth slot at the end of this file.
    # No monitor port in the base: the monitor lists subjects and subscriptions (who is watched) to the colo network.
    # The one healthcheck, for every merge, is a TCP probe of the client port (BusyBox "nc -z", in the pinned Alpine image),
    # so a nats-auth.conf made before the `http:` monitor line stays healthy. Never probe the monitor.
    command: ["-js", "-sd", "/data"]
    volumes:
      - nats-data:/data
    # No ports: NATS (4222) is reached on the colo network only.
    networks: [colo]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "4222"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  paper:
    # Budget: 3 CPUs, 8192m (no swap, 512 pids). The heap (MEMORY below) is 6G. Measured in C1-10.
    deploy:
      resources:
        limits:
          cpus: "${GELDAR_COLO_PAPER_CPUS:-3}"
          memory: "${GELDAR_COLO_PAPER_MEM:-8192m}"
          pids: 512
    memswap_limit: "${GELDAR_COLO_PAPER_MEM:-8192m}"
    pids_limit: 512
    logging: *logging
    labels: *colo-labels
    image: itzg/minecraft-server:2026.10.1-java25@sha256:d12aed7e35981dfe259b60fbfee77d23a19b5898a7a31dca298d18b47b7b5776
    # Writes the Velocity forwarding secret into paper-global.yml from its secret file, then starts the image.
    entrypoint: ["/bin/sh", "/geldar/paper-entrypoint.sh"]
    environment:
      # The itzg image starts as root and drops to this uid (default 1000); GELDAR_SERVICE_UID is the deploy's service uid.
      UID: "${GELDAR_SERVICE_UID:-1000}"
      GID: "${GELDAR_SERVICE_UID:-1000}"
      EULA: "TRUE"
      TYPE: PAPER
      VERSION: "26.1.2"
      PAPER_BUILD: "74"
      # Heap, a first guess below the memory limit (C1-10 measures it). The JVM needs headroom above the heap.
      MEMORY: 6G
      # The seed of the colo world. It is not in shards/colo.yaml (the shard-config schema has no seed key).
      SEED: "8675309"
      ONLINE_MODE: "FALSE"
      ENABLE_WHITELIST: "TRUE"
      ENFORCE_WHITELIST: "TRUE"
      HARDCORE: "FALSE"
      DIFFICULTY: normal
      VIEW_DISTANCE: "6"
      SIMULATION_DISTANCE: "5"
      MAX_PLAYERS: "400"
      SPAWN_PROTECTION: "0"
      ALLOW_FLIGHT: "TRUE"
      MOTD: "Geldar - no humans"
      ENABLE_RCON: "TRUE"
      RCON_PASSWORD_FILE: /run/secrets/rcon
      GELDAR_NATS_URL: nats://nats:4222
      GELDAR_SHARD: colo
      RCON_CMDS_STARTUP: "worldborder set 3000\ngamerule keep_inventory false\ngamerule immediate_respawn false\ngamerule show_advancement_messages false\ngamerule send_command_feedback false\ngamerule spectators_generate_chunks false"
    secrets: [rcon, velocity-forwarding]
    volumes:
      - paper-data:/data
      - ./paper/paper-entrypoint.sh:/geldar/paper-entrypoint.sh:ro
      - ../plugin/core/build/libs/geldar-core.jar:/plugins/geldar-core.jar:ro
      - {type: bind, source: '${GELDAR_STATE_DIR:-/var/lib/geldar-colo}/bluemap/bluemap.jar', target: /plugins/bluemap.jar, read_only: true} # BlueMap (C2-07o, R38): verified jar, read-only; web server on 8101, colo network only
      - ../plugins/bluemap/config:/plugins/BlueMap:ro
      - {type: bind, source: '${GELDAR_STATE_DIR:-/var/lib/geldar-colo}/chunky/chunky.jar', target: /plugins/chunky.jar, read_only: true} # Chunky (pregeneration): verified jar, read-only. Its data dir plugins/Chunky is created by the plugin in the writable paper-data volume.
      - {type: bind, source: '${GELDAR_STATE_DIR:-/var/lib/geldar-colo}/coreprotect/coreprotect.jar', target: /plugins/coreprotect.jar, read_only: true} # CoreProtect (block owner records): verified jar, read-only. Its data dir plugins/CoreProtect is created by the plugin in the writable paper-data volume.
    # No ports: the game port and RCON are not published. Velocity is the only game listener.
    networks: [colo]
    healthcheck:
      <<: *mc-health
      test: ["CMD-SHELL", "mc-health && read -r pid start < /tmp/geldar-core.ready && [ -n \"$$start\" ] && [ \"$$(cut -d' ' -f22 /proc/$$pid/stat 2>/dev/null)\" = \"$$start\" ]"]
    restart: unless-stopped

  velocity:
    # Budget: 0.5 CPU, 1024m (no swap, 256 pids). Measured in C1-10.
    deploy:
      resources:
        limits:
          cpus: "${GELDAR_COLO_VELOCITY_CPUS:-0.5}"
          memory: "${GELDAR_COLO_VELOCITY_MEM:-1024m}"
          pids: 256
    memswap_limit: "${GELDAR_COLO_VELOCITY_MEM:-1024m}"
    pids_limit: 256
    logging: *logging
    labels: *colo-labels
    image: itzg/mc-proxy:2026.10.2-java25@sha256:0b969bd3000d6e21ebb58444d062d63202cb552b5264b57a274fed7d2b411c0d
    environment:
      # Like Paper: the itzg image starts as root and drops to this uid, so it reads the 0600 service-uid secret and owns /server.
      UID: "${GELDAR_SERVICE_UID:-1000}"
      GID: "${GELDAR_SERVICE_UID:-1000}"
      TYPE: VELOCITY
      VELOCITY_VERSION: "3.5.1"
      VELOCITY_BUILD_ID: "615"
      MEMORY: 512M
      GELDAR_NATS_URL: nats://nats:4222
    secrets: [velocity-forwarding]
    volumes:
      - ./velocity/velocity.toml:/config/velocity.toml:ro
      - velocity-data:/server
      - ../plugin/velocity-identity/build/libs/geldar-velocity-identity.jar:/plugins/geldar-velocity-identity.jar:ro
    ports:
      # The colo bot ingress. Not 25565 (the production game server's port on this node) and never 25566.
      # A compose value must be literal: the loopback rule rejects interpolation, so the host port is fixed here
      # and shards/colo.yaml must say the same (geldar.ps1 checks it).
      - "127.0.0.1:25567:25565"
    networks: [colo]
    depends_on:
      paper:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "read -r pid start < /tmp/geldar-identity.ready && [ -n \"$$start\" ] && [ \"$$(cut -d' ' -f22 /proc/$$pid/stat 2>/dev/null)\" = \"$$start\" ] && exec 3<>/dev/tcp/127.0.0.1/25565"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  eventsink:
    # Budget: 0.5 CPU, 512m (no swap, 256 pids). Measured in C1-10.
    deploy:
      resources:
        limits:
          cpus: "${GELDAR_COLO_EVENTSINK_CPUS:-0.5}"
          memory: "${GELDAR_COLO_EVENTSINK_MEM:-512m}"
          pids: 256
    memswap_limit: "${GELDAR_COLO_EVENTSINK_MEM:-512m}"
    pids_limit: 256
    logging: *logging
    labels: *colo-labels
    # NATS GELDAR_EVENTS to Postgres `events`, idempotently (spec 7). Context is the repo root.
    build:
      context: ..
      dockerfile: eventsink/Dockerfile
    image: ${GELDAR_EVENTSINK_IMAGE:-geldar-eventsink:c1}
    user: "${GELDAR_SERVICE_UID:-1000}:${GELDAR_SERVICE_UID:-1000}"
    environment:
      GELDAR_NATS_URL: nats://nats:4222
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres
    secrets: [postgres]
    networks: [colo]
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped

  # [C1-03] The Body (Adam's Golem; golem/Dockerfile, decision 0083). Built locally (the `build:` key is how the digest rule treats it).
  # GELDAR_BODY_IMAGE is the tag (default geldar-body:c1); the deploy tooling (C1-04) sets the published, digest-pinned reference. No published port.
  golem-body:
    # Budget: 1 CPU, 2048m (no swap, 256 pids). Measured in C1-10.
    deploy:
      resources:
        limits:
          cpus: "${GELDAR_COLO_GOLEM_BODY_CPUS:-1}"
          memory: "${GELDAR_COLO_GOLEM_BODY_MEM:-2048m}"
          pids: 256
    memswap_limit: "${GELDAR_COLO_GOLEM_BODY_MEM:-2048m}"
    pids_limit: 256
    logging: *logging
    labels: *colo-labels
    build:
      context: ..
      dockerfile: golem/Dockerfile
    image: ${GELDAR_BODY_IMAGE:-geldar-body:c1}
    entrypoint: ["node", "src/adam/main.ts"]
    user: "${GELDAR_SERVICE_UID:-1000}:${GELDAR_SERVICE_UID:-1000}"
    environment:
      GELDAR_SHARD: colo
      # The colo service names are accepted only with this opt-in (decision 0131). The Body talks to Velocity, never Paper.
      GELDAR_IN_NETWORK_HOSTS: "1"
      GELDAR_MC_HOST: velocity
      GELDAR_MC_PORT: "25565"
      # The Body does not use RCON; the RCON host stays loopback by design, so only the port is set here.
      GELDAR_RCON_PORT: "25575"
      GELDAR_NATS_URL: nats://nats:4222
      GELDAR_NATS_USER: body
      GELDAR_NATS_PASSWORD_FILE: /run/secrets/nats-body.txt
      # Optional telemetry endpoint (C1-07). Unset in the host environment, it is unset in the container.
      GELDAR_TELEMETRY_URL:
    secrets: [{ source: nats-body, target: nats-body.txt }]
    volumes:
      # The Mind's shard file, under the name the Body reads (repo root + shards/<GELDAR_SHARD>.yaml). Not the budget file.
      - ../shards/colo-mind.yaml:/opt/geldar/shards/colo.yaml:ro
    networks: [colo]
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped

  # [C1-03] The Mind (Record/Mind host, decision 0078; animus/Dockerfile.mind). Built locally, as golem-body is; GELDAR_MIND_IMAGE
  # follows the same rule (default geldar-mind:c1). The model endpoint (the Thinker gateway) is configuration.
  animus:
    # Decision 0134: a profile until a Thinker path exists (decision 0078): `shard up colo` and deploy/colo-up.sh skip it.
    profiles: ["mind"]
    # Budget: 1 CPU, 2048m (no swap, 256 pids). Measured in C1-10.
    deploy:
      resources:
        limits:
          cpus: "${GELDAR_COLO_ANIMUS_CPUS:-1}"
          memory: "${GELDAR_COLO_ANIMUS_MEM:-2048m}"
          pids: 256
    memswap_limit: "${GELDAR_COLO_ANIMUS_MEM:-2048m}"
    pids_limit: 256
    logging: *logging
    labels: *colo-labels
    build:
      context: ..
      dockerfile: animus/Dockerfile.mind
    image: ${GELDAR_MIND_IMAGE:-geldar-mind:c1}
    entrypoint: ["node", "src/main.ts"]
    user: "${GELDAR_SERVICE_UID:-1000}:${GELDAR_SERVICE_UID:-1000}"
    environment:
      GELDAR_SHARD: colo
      GELDAR_IN_NETWORK_HOSTS: "1"
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres
      # Optional telemetry endpoint (C1-07), passed through from the host environment as for golem-body.
      GELDAR_TELEMETRY_URL:
      # NATS as the mind user (decision 0080): the password is a file, as golem-body's is. The URL is in-network.
      GELDAR_NATS_URL: nats://nats:4222
      GELDAR_NATS_USER: mind
      GELDAR_NATS_PASSWORD_FILE: /run/secrets/nats-mind.txt
    secrets: [postgres, { source: nats-mind, target: nats-mind.txt }]
    volumes:
      # The Mind's shard file, under the name the Mind reads (decision 0131). Not the budget file.
      - ../shards/colo-mind.yaml:/opt/geldar/shards/colo.yaml:ro
    networks: [colo]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # [C1-11a] The MCP server (threshold/mcp, spec 6.2; the image of compose/mcp.yml). The sovereign player's door: loopback 8788 only.
  # Token hashes live in Postgres (no token file). Postgres role geldar_mcp; password file postgres-mcp.txt.
  geldar-mcp:
    # Budget: 0.5 CPU, 512m (no swap, 128 pids). Read-only root, as compose/mcp.yml runs it.
    deploy:
      resources:
        limits:
          cpus: "${GELDAR_COLO_GELDAR_MCP_CPUS:-0.5}"
          memory: "${GELDAR_COLO_GELDAR_MCP_MEM:-512m}"
          pids: 128
    memswap_limit: "${GELDAR_COLO_GELDAR_MCP_MEM:-512m}"
    pids_limit: 128
    logging: *logging
    labels: *colo-labels
    build:
      context: ..
      dockerfile: threshold/mcp/Dockerfile
    image: ${GELDAR_MCP_IMAGE:-geldar-mcp:c1}
    environment:
      GELDAR_SHARD: colo
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      GELDAR_MCP_DB_PASSWORD_FILE: /run/secrets/postgres-mcp.txt
      GELDAR_MCP_PEPPER_FILE: /run/secrets/mcp-token-pepper.txt
      # Only inside the container may the server bind 0.0.0.0; the port is still published on loopback alone.
      GELDAR_MCP_IN_CONTAINER: "1"
      GELDAR_MCP_BIND: 0.0.0.0
      # The Host values local clients send to the loopback port. No public host (decision 0053 defers it).
      GELDAR_MCP_DEV_HOSTS: 127.0.0.1,localhost
      # Caddy (host network) may reach the publish as the docker bridge gateway: the node's deploy env sets the real peer
      # address (comma-separated; replaces public.trusted_proxies in shards/colo-mind.yaml). Decision 0132: none in the repo.
      GELDAR_MCP_TRUSTED_PROXIES: "${GELDAR_MCP_TRUSTED_PROXIES:-127.0.0.1}"
      # The act budget is suspended and every act is metered (decision 0149). Only "1" enforces the budget again.
      GELDAR_ACT_BUDGET_ENFORCE: "${GELDAR_ACT_BUDGET_ENFORCE:-0}"
      # NATS as the mcp user (decision 0080): the overlay compose/nats-auth-mcp.yml is not merged on colo, so the wiring is here.
      GELDAR_NATS_URL: nats://nats:4222
      GELDAR_NATS_USER: mcp
      GELDAR_NATS_PASSWORD_FILE: /run/secrets/nats-mcp.txt
    secrets: [postgres-mcp.txt, mcp-token-pepper.txt, { source: nats-mcp, target: nats-mcp.txt }]
    volumes:
      # The shard file the MCP reads (repo root + shards/<GELDAR_SHARD>.yaml), the Mind's file: it carries sovereign.
      - ../shards/colo-mind.yaml:/opt/geldar/shards/colo.yaml:ro
    ports:
      # The loopback MCP port. Literal: the loopback rule rejects interpolation (the same port as compose/mcp.yml).
      - "127.0.0.1:8788:8788"
    user: "${GELDAR_SERVICE_UID:-1000}:${GELDAR_SERVICE_UID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [colo]
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    # A TCP connect to the published port inside the container (compose/mcp.yml has the same probe).
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:net').connect(8788, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # [C2-08c] The register service (decision 0135, threshold/register): Microsoft (Entra) sign-in for sovereign-player owners.
  # OFF BY DEFAULT: profile `register`, REGISTER_KILL_SWITCH true, no Caddy site. Loopback 18090 only (decision 0150); Postgres role geldar_register.
  register:
    profiles: [register]
    # Budget: 0.25 CPU, 128m (no swap, 64 pids). Read-only root, as geldar-mcp runs.
    deploy:
      resources:
        limits:
          cpus: "${GELDAR_COLO_REGISTER_CPUS:-0.25}"
          memory: "${GELDAR_COLO_REGISTER_MEM:-128m}"
          pids: 64
    memswap_limit: "${GELDAR_COLO_REGISTER_MEM:-128m}"
    pids_limit: 64
    logging: *logging
    labels: *colo-labels
    build:
      context: ..
      dockerfile: threshold/register/Dockerfile
    image: ${GELDAR_REGISTER_IMAGE:-geldar-register:c2}
    environment:
      # The kill switch is on unless the deploy env says exactly "false" (config.ts). Read at start (ruling R26).
      REGISTER_KILL_SWITCH: "${REGISTER_KILL_SWITCH:-true}"
      # The public URL is a deploy value (the register host); the repo holds a placeholder only.
      REGISTER_PUBLIC_URL: "${REGISTER_PUBLIC_URL:-https://register.example.invalid}"
      # 0.0.0.0 inside the container; the port is published on loopback alone.
      REGISTER_HOST: 0.0.0.0
      REGISTER_PORT: "8090"
      # Microsoft (Entra) sign-in only (config.ts). The client id is a deploy value; the client secret is an owner-provided file.
      REGISTER_MS_CLIENT_ID: "${REGISTER_MS_CLIENT_ID:-}"
      REGISTER_MS_CLIENT_SECRET_FILE: /run/secrets/register-ms-secret
      # The key the gk_session cookie is signed with. Glass reads the same file (compose/colo-kino-session.yml).
      REGISTER_SESSION_KEY_FILE: /run/secrets/register-session-key
      REGISTER_PEPPER_FILE: /run/secrets/register-pepper
      # The MCP's token pepper: the register service mints tokens the MCP verifies.
      REGISTER_TOKEN_PEPPER_FILE: /run/secrets/mcp-token-pepper.txt
      REGISTER_SHARD: colo
      # The shard's sovereign.budget.cap_credits (shards/colo-mind.yaml), what the CLI path grants; a repo check pins them equal.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REGISTER_DB_PASSWORD_FILE: /run/secrets/postgres-register.txt
      # Caddy (host network) reaches the publish as the docker bridge gateway: the deploy env sets it (default: the MCP's trusted proxy, the same gateway).
      REGISTER_TRUSTED_PEERS: "${REGISTER_TRUSTED_PEERS:-${GELDAR_MCP_TRUSTED_PROXIES:-127.0.0.1}}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/').then((r)=>process.exit(r.status===200||r.status===503?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    secrets: [postgres-register.txt, mcp-token-pepper.txt, register-pepper, register-ms-secret, register-session-key]
    ports:
      # The loopback register port (decision 0150: 8090 is held on the shared node by another tenant). Literal: the loopback rule rejects interpolation. The container still listens on 8090.
      - "127.0.0.1:18090:8090"
    user: "${GELDAR_SERVICE_UID:-1000}:${GELDAR_SERVICE_UID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [colo]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  # [C2-07a2] Glass, the read-only public view (decisions 0072, 0093, 0094); image GELDAR_GLASS_IMAGE (C2-07a1). Postgres as geldar_glass.
  glass:
    deploy:
      resources:
        limits:
          cpus: "${GELDAR_COLO_GLASS_CPUS:-0.5}"
          memory: "${GELDAR_COLO_GLASS_MEM:-256m}"
          pids: 128
    memswap_limit: "${GELDAR_COLO_GLASS_MEM:-256m}"
    pids_limit: 128
    logging: *logging
    labels: *colo-labels
    build:
      context: ..
      dockerfile: glass/Dockerfile
    image: ${GELDAR_GLASS_IMAGE:-geldar-glass:c2}
    environment:
      GELDAR_IN_NETWORK_HOSTS: "1"
      GELDAR_GLASS_HOST: 0.0.0.0
      GELDAR_GLASS_PORT: "8787"
      GELDAR_GLASS_PG_HOST: postgres
      GELDAR_GLASS_PG_PORT: "5432"
      GELDAR_GLASS_PG_USER: geldar_glass
      GELDAR_GLASS_PG_PASSWORD_FILE: /run/secrets/postgres-glass.txt
      # Caddy is on the host network: set GELDAR_GLASS_TRUSTED_PROXIES in the deploy env to the peer address Glass logs.
      GELDAR_GLASS_TRUSTED_PROXIES: "${GELDAR_GLASS_TRUSTED_PROXIES:-127.0.0.1}"
      GELDAR_GLASS_DELAY_SECONDS: "${GELDAR_GLASS_DELAY_SECONDS:-60}"
      GELDAR_GLASS_ENABLED: "${GELDAR_GLASS_ENABLED:-true}"
      # Kino (decision 0075): OFF unless GELDAR_KINO_ENABLED=1 (docs/runbooks/kino.md); its NATS user (kino) may subscribe the feed and publish the control subject only.
      GELDAR_KINO_ENABLED: "${GELDAR_KINO_ENABLED:-0}"
      GELDAR_SHARD: "${GELDAR_SHARD:-phase0}"
      GELDAR_KINO_OTLP_ENDPOINT: "${GELDAR_KINO_OTLP_ENDPOINT:-}"
      # Private display aliases (docs/runbooks/glass-aliases.md): the file may be absent; then names show as stored.
      GELDAR_ALIASES_FILE: /run/geldar-aliases/aliases.json
    volumes:
      # A directory, not the file, so the stack starts when the node has no alias file (a missing file source would fail or become a directory).
      - {type: bind, source: '${GELDAR_STATE_DIR:-/var/lib/geldar-colo}/aliases', target: /run/geldar-aliases, read_only: true}
    secrets: [postgres-glass.txt]
    ports:
      # The loopback Glass port. Literal: the loopback rule rejects interpolation.
      - "127.0.0.1:8787:8787"
    user: "${GELDAR_SERVICE_UID:-1000}:${GELDAR_SERVICE_UID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [colo]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # The alias proxy between bluemap-web and Paper: rewrites live/players.json names to private aliases (file in the node state dir) or to the neutral label "Ranger" when there is no file or no alias (fail closed).
  # Colo network only, no published port. Plain Node (type stripping), the script is mounted read-only.
  bluemap-alias:
    deploy:
      resources:
        limits:
          cpus: "${GELDAR_COLO_BLUEMAP_ALIAS_CPUS:-0.1}"
          memory: "${GELDAR_COLO_BLUEMAP_ALIAS_MEM:-64m}"
          pids: 32
    memswap_limit: "${GELDAR_COLO_BLUEMAP_ALIAS_MEM:-64m}"
    pids_limit: 32
    logging: *logging
    labels: *colo-labels
    image: node:22.23.2-trixie-slim@sha256:c5849ff9c9ebcd66615412f0b548ca5b8ecaef84003dc9ac2e077ebe46aaa3f6
    command: ["node", "/app/alias-proxy.ts"]
    environment:
      GELDAR_ALIASES_FILE: /run/aliases/aliases.json
    volumes:
      - ../plugins/bluemap/alias-proxy/alias-proxy.ts:/app/alias-proxy.ts:ro
      # The private alias file lives in this directory on the node (a directory, so a missing file is not turned into one).
      - {type: bind, source: '${GELDAR_STATE_DIR:-/var/lib/geldar-colo}/aliases', target: /run/aliases, read_only: true}
    user: "${GELDAR_SERVICE_UID:-1000}:${GELDAR_SERVICE_UID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [colo]
    restart: unless-stopped

  # [C2-07c1, C2-07m] The BlueMap map server (R27, R38, decisions 0072, 0094). Paper writes the tiles under bluemap/web in its
  # volume and runs BlueMap's web server (port 8101) on the colo network only, never published. This caddy serves the tiles
  # read only from /srv and proxies only /maps/<map>/live/<file> to paper:8101 (live agent positions; spectators hidden in
  # plugin.conf), GET and HEAD only. Config: compose/bluemap-web/Caddyfile. The host Caddy (map.caddy) proxies to its loopback port.
  bluemap-web:
    # Budget: 0.25 CPU, 64m (no swap, 64 pids).
    deploy:
      resources:
        limits:
          cpus: "${GELDAR_COLO_BLUEMAP_WEB_CPUS:-0.25}"
          memory: "${GELDAR_COLO_BLUEMAP_WEB_MEM:-64m}"
          pids: 64
    memswap_limit: "${GELDAR_COLO_BLUEMAP_WEB_MEM:-64m}"
    pids_limit: 64
    logging: *logging
    labels: *colo-labels
    image: caddy@sha256:c3d7ee5d2b11f9dc54f947f68a734c84e9c9666c92c88a7f30b9cba5da182adb
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    environment:
      # Caddy writes its autosave and state under these; the root filesystem is read only, /tmp is a tmpfs.
      XDG_CONFIG_HOME: /tmp/config
      XDG_DATA_HOME: /tmp/data
    volumes:
      # Only the BlueMap webroot of the Paper volume (R28): server.properties (RCON password), the world and the plugin
      # configs are not mounted at all. A subpath needs Compose 2.30+ / Engine 26+ and the directory must exist at start.
      - type: volume
        source: paper-data
        target: /srv
        read_only: true
        volume:
          subpath: bluemap/web
      - ./bluemap-web/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../plugins/bluemap/web/geldar.css:/etc/caddy/geldar.css:ro
    ports:
      # The loopback map port. Literal: the loopback rule rejects interpolation.
      - "127.0.0.1:8100:8100"
    user: "${GELDAR_SERVICE_UID:-1000}:${GELDAR_SERVICE_UID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    # The caddy binary carries the file capability cap_net_bind_service; with it dropped and no-new-privileges set,
    # exec fails ("operation not permitted"). Adding it back lets exec work; the listener is :8100, so no low port is bound.
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    networks: [colo]
    depends_on:
      paper:
        condition: service_healthy
      bluemap-alias:
        condition: service_started
    restart: unless-stopped

  # [C1-11a] The player host (golem/src/players/main.ts): one Body per sovereign ranger, started by the player's presence record.
  # Set GELDAR_PLAYER_ID to a sovereign.players id of shards/colo-mind.yaml, then `docker compose --profile sovereign up`.
  # The profile keeps it out of a plain `shard up colo`. No published port.
  players-host:
    profiles: ["sovereign"]
    # Budget: 1 CPU, 2048m (no swap, 256 pids). The same Body image and size as golem-body.
    deploy:
      resources:
        limits:
          cpus: "${GELDAR_COLO_PLAYERS_HOST_CPUS:-1}"
          memory: "${GELDAR_COLO_PLAYERS_HOST_MEM:-2048m}"
          pids: 256
    memswap_limit: "${GELDAR_COLO_PLAYERS_HOST_MEM:-2048m}"
    pids_limit: 256
    logging: *logging
    labels: *colo-labels
    build:
      context: ..
      dockerfile: golem/Dockerfile
    image: ${GELDAR_BODY_IMAGE:-geldar-body:c1}
    entrypoint: ["node", "src/players/main.ts"]
    user: "${GELDAR_SERVICE_UID:-1000}:${GELDAR_SERVICE_UID:-1000}"
    command: ["--player", "${GELDAR_PLAYER_ID:-}"]
    environment:
      GELDAR_SHARD: colo
      # The colo service names are accepted only with this opt-in (decision 0131). The Body talks to Velocity and RCON to Paper.
      GELDAR_IN_NETWORK_HOSTS: "1"
      GELDAR_MC_HOST: velocity
      GELDAR_MC_PORT: "25565"
      GELDAR_RCON_HOST: paper
      GELDAR_RCON_PORT: "25575"
      GELDAR_RCON_PASSWORD_FILE: /run/secrets/rcon
      GELDAR_NATS_URL: nats://nats:4222
      GELDAR_NATS_USER: body
      GELDAR_NATS_PASSWORD_FILE: /run/secrets/nats-body.txt
    secrets: [rcon, { source: nats-body, target: nats-body.txt }]
    volumes:
      # The Mind's shard file, under the name the player host reads (the player list is its sovereign.players).
      - ../shards/colo-mind.yaml:/opt/geldar/shards/colo.yaml:ro
    networks: [colo]
    depends_on:
      paper:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped

  # [C1-11b] The admin one-shot (decision 0133): tools/migrate and tools/mcp-tokens, never started by `shard up colo` (the profile).
  #   docker compose -p geldar-colo -f compose/colo.yml --profile admin run --rm admin <subcommand>   (from the repo root)
  # Publishes nothing. Token files go only to the overlay mount deploy/colo-admin.sh adds (an absolute path is refused here).
  admin:
    profiles: ["admin"]
    # Budget: 0.5 CPU, 512m (no swap, 128 pids). A one-shot: it runs one CLI and exits.
    deploy:
      resources:
        limits:
          cpus: "${GELDAR_COLO_ADMIN_CPUS:-0.5}"
          memory: "${GELDAR_COLO_ADMIN_MEM:-512m}"
          pids: 128
    memswap_limit: "${GELDAR_COLO_ADMIN_MEM:-512m}"
    pids_limit: 128
    logging: *logging
    labels: *colo-labels
    # Context is the repo root; the image is the one tools/admin/Dockerfile builds. GELDAR_ADMIN_IMAGE is the published tag.
    build:
      context: ..
      dockerfile: tools/admin/Dockerfile
    image: ${GELDAR_ADMIN_IMAGE:-geldar-admin:c1}
    restart: "no"
    environment:
      # The colo shard the CLIs read for the owner caps, harness rules and persona limits (not shards/phase0.yaml).
      GELDAR_SHARD_FILE: /opt/geldar/shards/colo.yaml
      # admin.sh reads the superuser password from this file into PGPASSWORD for its own process only.
      GELDAR_ADMIN_PG_PASSWORD_FILE: /run/secrets/postgres
      PGHOST: postgres
      # ensure-skins-bucket (C2-07j): the body NATS user makes the geldar-skins bucket, which velocity only reads.
      GELDAR_NATS_URL: nats://nats:4222
      GELDAR_NATS_USER: body
      GELDAR_NATS_PASSWORD_FILE: /run/secrets/nats-body.txt
      # whitelist-house-body (C2-07k): the one-shot adds the house Body to Paper's whitelist over RCON before golem-body starts.
      GELDAR_IN_NETWORK_HOSTS: "1"
      GELDAR_RCON_HOST: paper
      GELDAR_RCON_PORT: "25575"
      GELDAR_RCON_PASSWORD_FILE: /run/secrets/rcon
    # postgres: the superuser password (admin.sh). postgres-mcp.txt: the file `migrate --set-role-password geldar_mcp`
    # reads; postgres-glass.txt: the same for geldar_glass (C2-07d). mcp-token-pepper.txt: the pepper token-mint hashes with, at the path the CLI computes (repo root + compose/secrets).
    secrets: [postgres, rcon, postgres-mcp.txt, postgres-glass.txt, postgres-register.txt, { source: nats-body, target: nats-body.txt }, { source: mcp-token-pepper.txt, target: /opt/geldar/compose/secrets/mcp-token-pepper.txt }]
    volumes:
      # The colo shard file (the Mind's file, which carries sovereign), under the path GELDAR_SHARD_FILE names.
      - ../shards/colo-mind.yaml:/opt/geldar/shards/colo.yaml:ro
    user: "${GELDAR_SERVICE_UID:-1000}:${GELDAR_SERVICE_UID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [colo]
    depends_on:
      postgres:
        condition: service_healthy

# The colo network: fixed name, so it cannot collide with the Phase 0 network.
networks:
  colo:
    name: geldar-colo
    # Pinned (ruling R32): host-network Caddy reaches the loopback publishes as the bridge gateway (.1 of this subnet), which
    # Glass and the MCP trust. The node sets GELDAR_COLO_SUBNET to a private /24 in 172.16/12 (colo-up.sh saves it in node.env).
    ipam:
      config:
        - subnet: "${GELDAR_COLO_SUBNET:-192.0.2.0/24}"

secrets:
  postgres:
    file: ./secrets/postgres.txt
  rcon:
    file: ./secrets/rcon.txt
  velocity-forwarding:
    file: ./secrets/velocity-forwarding.txt
  # The Body's NATS password (C1-03). Written by the NATS-auth tooling (C1-06a), never stored in this file.
  nats-body:
    file: ./secrets/nats-body.txt
  # The Mind's NATS password (animus, decision 0080). Written by `shard nats-auth colo` like nats-body.
  nats-mind:
    file: ./secrets/nats-mind.txt
  # The MCP's Postgres password, pepper and NATS password (C1-11a). Written by `mcp-tokens init` and `shard nats-auth colo`.
  postgres-mcp.txt:
    file: ./secrets/postgres-mcp.txt
  mcp-token-pepper.txt:
    file: ./secrets/mcp-token-pepper.txt
  nats-mcp:
    file: ./secrets/nats-mcp.txt
  # Glass's Postgres password for the geldar_glass role (C2-07a2).
  postgres-glass.txt:
    file: ./secrets/postgres-glass.txt
  # The register service (C2-08c, Microsoft only): Postgres password, pepper, Entra client secret (owner-provided), session key
  # (gen-secrets.sh). Declared once here; compose/colo-kino-session.yml mounts the session key into Glass. The two new files follow GELDAR_SECRETS_DIR.
  postgres-register.txt:
    file: ./secrets/postgres-register.txt
  register-pepper:
    file: ./secrets/register-pepper.txt
  register-ms-secret:
    file: ${GELDAR_SECRETS_DIR:-./secrets}/register-ms-secret.txt
  register-session-key:
    file: ${GELDAR_SECRETS_DIR:-./secrets}/register-session-key.txt

volumes:
  postgres-data:
  nats-data:
  paper-data:
  velocity-data:

# Slots filled by C1/C2 packets: NATS auth is the overlay compose/nats-auth.yml, merged by `shard up colo` (decision 0080); see decision 0082 for the budgets.
