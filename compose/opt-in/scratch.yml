# Throwaway scratch stack overlay (sheet campaign validation). Not part of any default compose file set: it sits
# outside compose/*.yml so the compose lane does not validate it standalone. Use only through deploy/scratch/scratch.sh:
#   docker compose -p scratch-<suffix> -f compose/phase0.yml -f compose/nats-auth.yml -f compose/opt-in/scratch.yml ...
# (the script adds compose/nats-auth.yml only when SCRATCH_NATS_AUTH_DIR is set; see docs/runbooks/scratch-stack.md).
# It replaces every published port with a loopback-only one on a high default port (the !override tag), so it runs
# beside the phase0 and Colo stacks without clashing. Every service gets hard memory and CPU caps (no swap beyond the
# memory cap), restart "no", and the label geldar.scratch=true. Ports and memory come from the environment; the
# defaults are the values the runbook names.
services:
  postgres:
    ports: !override
      - "127.0.0.1:${SCRATCH_PG_PORT:-15432}:5432"
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: "0.5"
    memswap_limit: 768m
    labels:
      geldar.scratch: "true"
    restart: "no"

  nats:
    ports: !override
      - "127.0.0.1:${SCRATCH_NATS_PORT:-14222}:4222"
      - "127.0.0.1:${SCRATCH_NATS_MON_PORT:-18222}:8222"
    # The auth overlay (nats-auth.yml) replaces the command without -m 8222, so the monitor listens only when the generated
    # conf has an `http:` line. The phase0 wget probe of the monitor then fails. Probe the client port, as colo.yml does.
    # Never probe the monitor.
    healthcheck: !override
      test: ["CMD", "nc", "-z", "127.0.0.1", "4222"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"
    memswap_limit: 256m
    labels:
      geldar.scratch: "true"
    restart: "no"

  paper:
    # The itzg image starts as root and drops to UID:GID (its default is 1000:1000). Set to the account uid:gid, as
    # compose/colo.yml does with GELDAR_SERVICE_UID, so the root entrypoint reads the 0600 secrets and the dropped JVM owns /data.
    environment:
      MEMORY: ${PAPER_MEMORY:-2G}
      UID: "${SCRATCH_RUN_UID:?set by deploy/scratch/scratch.sh}"
      GID: "${SCRATCH_RUN_GID:?set by deploy/scratch/scratch.sh}"
    # RCON only, on loopback: the host port is SCRATCH_RCON_PORT (default 35575, the scratch-a value; deploy/scratch/<suffix>.env
    # sets another per project). The game port is never published. Same mapping as compose/opt-in/scratch-neoforge.yml.
    ports: !override
      - "127.0.0.1:${SCRATCH_RCON_PORT:-35575}:25575"
    deploy:
      resources:
        limits:
          memory: 3072m
          cpus: "1.5"
    memswap_limit: 3072m
    labels:
      geldar.scratch: "true"
    restart: "no"

  velocity:
    # Like Paper: the itzg image starts as root and drops to UID:GID, so the forwarding-secret file (0600, the account's) is readable.
    environment:
      UID: "${SCRATCH_RUN_UID:?set by deploy/scratch/scratch.sh}"
      GID: "${SCRATCH_RUN_GID:?set by deploy/scratch/scratch.sh}"
    ports: !override
      - "127.0.0.1:${SCRATCH_MC_PORT:-35565}:25565"
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: "0.5"
    memswap_limit: 768m
    labels:
      geldar.scratch: "true"
    restart: "no"
    # The plugin only reads geldar-life-registry and geldar-skins and never creates them (decision 0087 correction), so
    # the seed below runs first. Without its buckets the plugin never marks the registry synced, and the healthcheck fails.
    depends_on:
      identity-seed:
        condition: service_completed_successfully

  # One-shot: creates the two identity buckets before velocity starts (golem/src/seed-buckets.ts, the same bucket configs
  # golem and deploy/colo-admin.sh use). It runs as the scratch-only `seed` NATS user, so no body or mind password is used.
  identity-seed:
    build:
      context: ..
      dockerfile: tools/admin/Dockerfile
    image: ${GELDAR_ADMIN_IMAGE:-geldar-admin:c1}
    entrypoint: ["node", "/opt/geldar/golem/src/seed-buckets.ts"]
    # As the eventsink: the 0600 seed password file is the account's, so the image's uid 1000 cannot read it.
    user: "${SCRATCH_RUN_UID:?set by deploy/scratch/scratch.sh}:${SCRATCH_RUN_GID:?set by deploy/scratch/scratch.sh}"
    environment:
      GELDAR_NATS_URL: nats://nats:4222
      GELDAR_NATS_USER: seed
      GELDAR_NATS_PASSWORD_FILE: /run/secrets/nats-seed.txt
    secrets: [nats-seed.txt]
    depends_on:
      nats:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.25"
    memswap_limit: 256m
    labels:
      geldar.scratch: "true"
    restart: "no"

  eventsink:
    # Runs as the uid:gid of the account that started the stack (set_env in deploy/scratch/scratch.sh), not the image's
    # node user. The 0600 secret files and the NATS files in SCRATCH_NATS_AUTH_DIR are owned by that account, so this
    # user can read them without any mode change or ACL. identity-seed sets the same user (its 0600 seed password file).
    # paper and velocity get the same uid:gid as UID and GID environment variables instead, for the itzg entrypoint.
    user: "${SCRATCH_RUN_UID:?set by deploy/scratch/scratch.sh}:${SCRATCH_RUN_GID:?set by deploy/scratch/scratch.sh}"
    deploy:
      resources:
        limits:
          memory: 384m
          cpus: "0.25"
    memswap_limit: 384m
    labels:
      geldar.scratch: "true"
    restart: "no"

# Secret files live in the per-user state directory deploy/scratch/scratch.sh creates ($SCRATCH_SECRETS_DIR, mode 0700,
# files 0600). The NATS auth files are read only when the caller passed SCRATCH_NATS_AUTH_DIR to up.
secrets:
  postgres:
    file: ${SCRATCH_SECRETS_DIR:?set by deploy/scratch/scratch.sh}/postgres.txt
  rcon:
    file: ${SCRATCH_SECRETS_DIR:?set by deploy/scratch/scratch.sh}/rcon.txt
  velocity-forwarding:
    file: ${SCRATCH_SECRETS_DIR:?set by deploy/scratch/scratch.sh}/velocity-forwarding.txt
  nats-auth.conf:
    file: ${SCRATCH_NATS_AUTH_DIR:-${SCRATCH_SECRETS_DIR:?set by deploy/scratch/scratch.sh}}/nats-auth.conf
  nats-paper.txt:
    file: ${SCRATCH_NATS_AUTH_DIR:-${SCRATCH_SECRETS_DIR:?set by deploy/scratch/scratch.sh}}/nats-paper.txt
  nats-velocity.txt:
    file: ${SCRATCH_NATS_AUTH_DIR:-${SCRATCH_SECRETS_DIR:?set by deploy/scratch/scratch.sh}}/nats-velocity.txt
  nats-eventsink.txt:
    file: ${SCRATCH_NATS_AUTH_DIR:-${SCRATCH_SECRETS_DIR:?set by deploy/scratch/scratch.sh}}/nats-eventsink.txt
  nats-seed.txt:
    file: ${SCRATCH_NATS_AUTH_DIR:-${SCRATCH_SECRETS_DIR:?set by deploy/scratch/scratch.sh}}/nats-seed.txt

# The world volume is named by the script (<project>_paper-data), never the live phase0 volume.
volumes:
  paper-data:
    name: ${GELDAR_WORLD_VOLUME:?set by deploy/scratch/scratch.sh}
