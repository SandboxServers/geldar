# Scratch NeoForge ledger jar and OpenTelemetry agent (suffix nf). Layers after compose/opt-in/scratch-neoforge.yml and is added by
# deploy/scratch/scratch.sh only when SCRATCH_PLATFORM=neoforge and SCRATCH_NEOFORGE_LEDGER_JAR is set (see deploy/scratch/scratch-ledger.sh
# and docs/runbooks/scratch-stack.md, "Ledger jar and OTel agent on the scratch NeoForge stack"). Without it this file is not in the
# compose command, so the default render has no ledger mount. Every mount is read-only and comes from a host variable that scratch.sh
# sets; the required-variable markers make compose fail if this file is used without them. When the agent is off, scratch.sh points
# the two agent mounts at the ledger files: the entrypoint never reads them then. No network is declared here.
# GELDAR_NF_OTEL_AGENT defaults to 0: the agent runs only when scratch.sh sets it to 1 (all three SCRATCH_NEOFORGE_OTEL_AGENT_* values given).
services:
  paper:
    environment:
      GELDAR_NF_LEDGER_SHA256: ${GELDAR_NF_LEDGER_SHA256:?set by deploy/scratch/scratch-ledger.sh from SCRATCH_NEOFORGE_LEDGER_SHA256}
      GELDAR_NF_OTEL_AGENT: ${GELDAR_NF_OTEL_AGENT:-0}
      GELDAR_NF_OTEL_AGENT_SHA256: ${GELDAR_NF_OTEL_AGENT_SHA256:-}
    volumes:
      - type: bind
        source: ${GELDAR_NF_LEDGER_JAR_HOST:?set by deploy/scratch/scratch-ledger.sh from SCRATCH_NEOFORGE_LEDGER_JAR}
        target: /geldar/mods/geldar-ledger.jar
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${GELDAR_NF_OTEL_AGENT_JAR_HOST:?set by deploy/scratch/scratch-ledger.sh from SCRATCH_NEOFORGE_OTEL_AGENT_JAR}
        target: /opt/otel/opentelemetry-javaagent.jar
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${GELDAR_NF_OTEL_AGENT_PROPS_HOST:?set by deploy/scratch/scratch-ledger.sh from SCRATCH_NEOFORGE_OTEL_AGENT_PROPS}
        target: /opt/otel/otel-agent.properties
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${GELDAR_NF_LEDGER_PROPS_HOST:?set by deploy/scratch/scratch-ledger.sh from SCRATCH_LEDGER_PROPS}
        target: /data/config/ledger.properties
        read_only: true
        bind:
          create_host_path: false
