# Opt-in human lane for the live NeoForge shard (project geldar-nf). It renders TOGETHER with compose/nf-live.yml:
#   docker compose -p geldar-nf -f compose/nf-live.yml -f compose/nf-live-human.yml config --quiet
# deploy/nf-deploy.sh adds it only with NF_HUMAN=on. It adds two services: velocity-human, an online-mode Velocity for human
# players, forwarding to the existing neoforge backend with the same forwarding secret the live velocity uses; and
# velocity-human-init, a one-shot root chown of the proxy's volume (VOLUME INIT below).
# NATS: the identity plugin's human lane reads the life registry (LoginGate denies every login while a configured registry is
# unsynced, plugin/velocity-identity LoginGate.java:55 and :68) and the skins bucket (IdentityPlugin.java:139-142). It takes its
# OWN NATS user, human, and its password file (nats-human.txt, generated by nats-auth-nf.ps1). That grant is read only: the
# registry and skins watch, no $KV publish, no $JS.API wildcard, no event subject. It has no RCON or postgres access.
#
# NETWORK: velocity-human is on nf-human only, not on nf. nats and neoforge join nf-human as well (the services below), so the
# forced backend (neoforge:25565) and the NATS URL (nats:4222) resolve there. Nothing else is on nf-human.
#
# VOLUME INIT: the named volume velocity-human-data is created root-owned. The live velocity avoids that by starting as root
# (the itzg image chowns its volume, then drops to the service uid). The human proxy never runs as root, so it could not write
# the jar install-paper downloads into /server (AccessDeniedException). velocity-human-init fixes only that: a one-shot as root
# with network_mode none, cap_drop ALL and cap_add CHOWN, mounting only the volume, that chowns /server to the service uid:gid
# and exits 0. velocity-human depends on it (service_completed_successfully). The proxy itself is unchanged: non-root,
# read-only, cap_drop ALL, tmpfs /tmp without exec.
#
# THE ONLY PUBLISHED PORT THIS FILE ADDS: host side ${NF_HUMAN_BIND:-127.0.0.1}:${NF_HUMAN_PORT:-46566}, container 25565.
# The defaults render on loopback. The bind address is an owner decision: it is NOT approved to be public, and no public
# name, port or bind is set anywhere in the repo. The loopback rule (tools/repo-checks/src/loopback-ports.ts) allows this one
# exact publish and nothing else. Live velocity (127.0.0.1:46565) is unchanged, and no other service here publishes.
#
# UNPROVEN (read before any run): the scratch human lane has never had a real human join. Nothing here has been started.
# UNVERIFIED: that chown runs in velocity-human-init as uutils with only CAP_CHOWN (the image's /usr/bin/chown was inspected,
# the run was not), so it is UNVERIFIED until a run; whether itzg/mc-proxy runs with read_only and the uid set here (it may
# need a writable path beyond /server and /tmp); that the human NATS user may read the registry and skins buckets (its grant copies velocity's read set; the server's KV ACL
# is not re-read here, and the flow-control subject form $JS.FC.KV_<bucket>.> is not checked against a live server). ISOLATION
# IS PROVEN ONLY BY RENDER AND ACL TESTS (nf-live-human.test.ts, nats-human-grants-nf.test.ts, nf-human-gate.test.ts): no node,
# no container was started. The first real join, and that velocity-human reaches nats and neoforge on nf-human, are the owner's S1 test on live.
# The netty tcnative warning ("exists but cannot be executed ... check volume for noexec") is expected and harmless: netty falls
# back to the JDK TLS implementation. /tmp stays noexec by default; do not relax it to silence the warning.
#
# Budget: 0.5 CPU, 768 MiB, 256 pids, via deploy.resources.limits (the only pids setting: no pids_limit here).
name: geldar-nf

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  velocity-human:
    image: &human-image itzg/mc-proxy:2026.10.2-java25@sha256:0b969bd3000d6e21ebb58444d062d63202cb552b5264b57a274fed7d2b411c0d
    # The service user, not root: the forwarding secret (0600, the account's) is read as this uid. No UID/GID env is set,
    # so the image does not drop privileges from root here.
    user: "${NF_SERVICE_UID:-1000}:${NF_SERVICE_GID:-${NF_SERVICE_UID:-1000}}"
    environment:
      TYPE: VELOCITY
      VELOCITY_VERSION: "3.5.1"
      VELOCITY_BUILD_ID: "615"
      MEMORY: 512M
      # The identity plugin's human lane: online-mode names, agent-shaped names refused (plugin/velocity-identity).
      GELDAR_IDENTITY_LANE: human
      GELDAR_NATS_URL: nats://nats:4222
      GELDAR_NATS_USER: human
      GELDAR_NATS_PASSWORD_FILE: /run/secrets/nats-human.txt
      # Every inbox subject the identity clients open is under this prefix, and the human NATS user is granted only it
      # (deploy/nats-auth-nf.ps1 `human`; the same value, checked by nats-human-grants-nf.test.ts). UNVERIFIED until S1 on a
      # live NATS: the KV watch's ordered consumer and inbox under a custom prefix, the exact permission set a push watch
      # needs (publish on the inbox is granted in case the client replies there), and the server's enforcement of both.
      GELDAR_NATS_INBOX_PREFIX: "_INBOX.human."
    secrets: [velocity-forwarding, nats-human.txt]
    volumes:
      - ./velocity/velocity-nf-human.toml:/config/velocity.toml:ro
      - velocity-human-data:/server
      # The identity jar, read-only. create_host_path false: a missing jar fails the start; compose never creates an empty directory there.
      - type: bind
        source: ../plugin/velocity-identity/build/libs/geldar-velocity-identity.jar
        target: /plugins/geldar-velocity-identity.jar
        read_only: true
        bind:
          create_host_path: false
    ports:
      # The one non-loopback-capable publish in the repo, bound only by NF_HUMAN_BIND (default 127.0.0.1). Exact string,
      # checked by loopback-ports.ts. Never 25565 or 25566.
      - "${NF_HUMAN_BIND:-127.0.0.1}:${NF_HUMAN_PORT:-46566}:25565"
    networks: [nf-human]
    depends_on:
      neoforge:
        condition: service_healthy
      nats:
        condition: service_healthy
      identity-seed:
        condition: service_completed_successfully
      velocity-human-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Port open AND the identity plugin enabled in this proxy process (as the live velocity service; the ready file is in
      # this container's own /tmp, a tmpfs here). ($$ is Compose's escape.)
      test: ["CMD", "bash", "-c", "read -r pid start < /tmp/geldar-identity.ready && [ -n \"$$start\" ] && [ \"$$(cut -d' ' -f22 /proc/$$pid/stat 2>/dev/null)\" = \"$$start\" ] && exec 3<>/dev/tcp/127.0.0.1/25565"]
      # Short on purpose: a plugin that never writes the ready marker (missing, empty or invalid jar, registry unsynced) makes
      # `up --wait` fail after start_period plus retries x interval, 20 s + 3 x 5 s = 35 s (under 40 s), not after 110 s.
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 768m
          pids: 256
    memswap_limit: 768m
    stop_grace_period: 30s
    logging: *logging
    labels:
      geldar.project: geldar-nf
      com.centurylinklabs.watchtower.enable: "false"
    # unless-stopped: the proxy comes back after a host reboot with the config it was created with (compose is not re-run at boot).
    # The identity plugin retries NATS forever, so at boot it recovers within seconds of nats being ready (docker restarts all
    # containers at once and does not honour depends_on there). A failed FIRST start is a restart loop with backoff and the public
    # port refuses between attempts: fail-closed, nobody admitted. nf-deploy.sh human_fail runs `stop`, which Docker remembers
    # across reboots, so a stopped proxy stays down until the next `up`. A stop that fails leaves the loop running (see the runbook).
    restart: unless-stopped

  velocity-human-init:
    image: *human-image
    user: "0:0"
    # Argv form, no shell: one chown of /server to the same uid:gid velocity-human runs as (one list element).
    entrypoint: ["/usr/bin/chown", "${NF_SERVICE_UID:-1000}:${NF_SERVICE_GID:-${NF_SERVICE_UID:-1000}}", "/server"]
    # The image's HEALTHCHECK and /server WORKDIR are not inherited: the init exits at once and runs from /.
    healthcheck:
      disable: true
    working_dir: /
    volumes:
      - velocity-human-data:/server
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 64m
          pids: 16
    logging: *logging
    labels:
      geldar.project: geldar-nf
      com.centurylinklabs.watchtower.enable: "false"
    # "no", deliberately: this is a one-shot. With unless-stopped it would run the chown again at every boot.
    restart: "no"

  # The two services the human proxy reaches by name join nf-human as well. Their nf membership is unchanged (nf-live.yml); compose
  # merges the lists. nats serves the NATS URL, neoforge the forced backend. Nothing else in this file joins nf-human.
  nats:
    networks: [nf, nf-human]
  neoforge:
    networks: [nf, nf-human]

volumes:
  velocity-human-data: {}

# The human lane's own network. Not internal: velocity-human must reach Mojang's session servers (online-mode).
networks:
  nf-human: {}

# The human lane's own NATS password file (nats-auth-nf.ps1 writes it). The base file does not declare it.
secrets:
  nats-human.txt:
    file: ${NF_SECRETS_DIR:-./secrets-nf}/nats-human.txt
