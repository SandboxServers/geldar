# AN-12b, opt-in: the eventsink's state service, outbox publisher and XP ledger. Not part of any default compose file set:
# colo.yml and phase0.yml leave these variables out, so the eventsink runs as before. Use it only with:
#   docker compose -f compose/colo.yml -f compose/sheet-sink.yml up -d eventsink
# Each variable is passed from the host environment when it is set, and left out of the container when it is not.
# GELDAR_SHEET_SHARD names the shard. It is not GELDAR_SHARD, the ambient operator variable.
# GELDAR_PROFICIENCY_THRESHOLDS needs GELDAR_XP=1, and while a shard is set it must be unset or the defaults (10,30,70).
services:
  eventsink:
    environment:
      GELDAR_SHEET_SHARD:
      GELDAR_XP:
      GELDAR_PROFICIENCY_THRESHOLDS:
