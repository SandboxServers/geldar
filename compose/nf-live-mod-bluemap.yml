# Optional extra mod overlay: BlueMap (live map) on the live NeoForge project (compose/nf-live.yml). deploy/nf-deploy.sh adds it
# only when NF_EXTRA_MODS names bluemap (see deploy/nf-extra-mods-lib.sh and docs/runbooks/nf-extra-mods.md). Unset, nothing is added.
# It adds to the neoforge service only:
#   - one read-only bind mount with create_host_path false (a missing host file fails the start): the BlueMap jar, from
#     NF_EXTRA_BLUEMAP_JAR_HOST, mounted at /geldar/extra-mods/bluemap.jar.
#   - GELDAR_NF_EXTRA_BLUEMAP_SHA256, a constant: the pin of the jar, the same line as in compose/neoforge/extra-mods.pins (a test
#     asserts it equals the file). The entrypoint copies the mounted jar into mods/ only when it matches this pin.
# It joins no network, publishes no port and mounts nothing else. CI renders this file alone, so it repeats the neoforge image
# (a test asserts it equals the one in nf-live.yml).
services:
  neoforge:
    image: itzg/minecraft-server:2026.10.1-java25@sha256:d12aed7e35981dfe259b60fbfee77d23a19b5898a7a31dca298d18b47b7b5776
    environment:
      GELDAR_NF_EXTRA_BLUEMAP_SHA256: "8938f4453af4b53970c86e43d0bd26b4a88980e4e6639f818fa770d0f61c43df"
    volumes:
      - type: bind
        source: ${NF_EXTRA_BLUEMAP_JAR_HOST:-./nf-live-unset/bluemap.jar}
        target: /geldar/extra-mods/bluemap.jar
        read_only: true
        bind:
          create_host_path: false
