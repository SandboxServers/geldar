# OpenTelemetry Java agent profile for Paper (PT-02b, decision 0351 point 2). Minimal on purpose:
# every auto-instrumentation is off, and only the three below are enabled.
# The file is inert: it is mounted and JAVA_AGENTS is set only by the opt-in overlay compose/opt-in/colo-paper-agents.yml.
# No address, token or header lives here; the gateway endpoint is a compose DNS name.
#
# Wiring requirement for PT-02a: the agent reads this file ONLY when it is given
# otel.javaagent.configuration-file (or the environment variable OTEL_JAVAAGENT_CONFIGURATION_FILE)
# pointing at it. The itzg JAVA_AGENTS variable passes a bare -javaagent with no options, so PT-02a
# must also set that option or variable. Precedence: system property > environment > this file, so
# OTEL_SDK_DISABLED=false in the environment overrides otel.sdk.disabled below.
#
# JFR-sourced metrics are deliberately NOT enabled here (no emit-experimental-jfr-metrics, no
# experimental.jfr-metrics.included): the plugin's own JFR stream (cards PT-09a, PT-09b) produces them.
# The deprecated emit-experimental-telemetry key is not used either.
#
# Key names were checked against the OpenTelemetry Java agent 2.33.1 documentation; the section is
# named above each group.

# Agent configuration, "Suppressing specific instrumentation": everything off by default, then three on.
otel.instrumentation.common.default-enabled=false
otel.instrumentation.opentelemetry-api.enabled=true
otel.instrumentation.runtime-telemetry.enabled=true
otel.instrumentation.log4j-appender.enabled=true
# log4j-appender instrumentation README: adds thread.name and thread.id to log records.
otel.instrumentation.log4j-appender.experimental-log-attributes=true
otel.instrumentation.java-util-logging.enabled=false

# SDK configuration, "Propagators": only W3C trace context; no Baggage.
otel.propagators=tracecontext

# SDK configuration, "OTLP exporter": OTLP over HTTP to the gateway on geldar-colo.
otel.exporter.otlp.protocol=http/protobuf
otel.exporter.otlp.endpoint=http://geldar-gateway:4318

# SDK configuration, "Resource": the plugin sets none; deployment.environment is deliberately not set.
otel.resource.attributes=service.namespace=geldar
otel.service.name=geldar-paper

# SDK configuration, "Disabling the SDK": the node flips this to false together with the window (PT-16).
# Until then the agent exports nothing.
otel.sdk.disabled=true

# SDK configuration, "Periodic metric reader".
otel.metric.export.interval=15000

# SDK configuration, "Batch span processor" and "Batch log record processor": bounded queues,
# a slow gateway drops records, it never grows memory.
otel.bsp.max.queue.size=2048
otel.blrp.max.queue.size=2048
