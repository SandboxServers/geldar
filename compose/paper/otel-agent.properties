# OpenTelemetry Java agent profile for Paper (PT-02b, decision 0351 point 2). Minimal on purpose:
# every auto-instrumentation is off, and only the three below are enabled.
# The file is inert: nothing mounts it or sets JAVA_AGENTS until the Colo window (PT-02a, PT-16).
# No address, token or header lives here; the gateway endpoint is a compose DNS name.

# Everything off by default, then three switched on.
otel.instrumentation.common.default-enabled=false
otel.instrumentation.opentelemetry-api.enabled=true
otel.instrumentation.runtime-telemetry.enabled=true
otel.instrumentation.runtime-telemetry.emit-experimental-telemetry=true
otel.instrumentation.log4j-appender.enabled=true
otel.instrumentation.log4j-appender.experimental-log-attributes=true
otel.instrumentation.java-util-logging.enabled=false

# Only W3C trace context; no Baggage.
otel.propagators=tracecontext

# OTLP over HTTP to the gateway on geldar-colo.
otel.exporter.otlp.protocol=http/protobuf
otel.exporter.otlp.endpoint=http://otel-gateway:4318

# Resource attributes (the plugin sets none; deployment.environment is deliberately not set).
otel.resource.attributes=service.namespace=geldar
otel.service.name=geldar-paper

# The node flips this to false together with the window (PT-16). Until then the agent exports nothing.
otel.sdk.disabled=true

otel.metric.export.interval=15000

# Bounded batch queues: a slow gateway drops records, it never grows memory.
otel.bsp.max.queue.size=2048
otel.blrp.max.queue.size=2048
