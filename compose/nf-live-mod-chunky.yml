# Optional extra mod overlay: Chunky (pregeneration) on the live NeoForge project (compose/nf-live.yml). deploy/nf-deploy.sh adds it
# only when NF_EXTRA_MODS names chunky (see deploy/nf-extra-mods-lib.sh and docs/runbooks/nf-extra-mods.md). Unset, nothing is added.
# It adds to the neoforge service only:
#   - one read-only bind mount with create_host_path false (a missing host file fails the start): the Chunky jar, from
#     NF_EXTRA_CHUNKY_JAR_HOST, mounted at /geldar/extra-mods/chunky.jar.
#   - GELDAR_NF_EXTRA_CHUNKY_SHA256, a constant: the pin of the jar, the same line as in compose/neoforge/extra-mods.pins (a test
#     asserts it equals the file). The entrypoint copies the mounted jar into mods/ only when it matches this pin.
# It joins no network, publishes no port and mounts nothing else. CI renders this file alone, so it repeats the neoforge image
# (a test asserts it equals the one in nf-live.yml).
services:
  neoforge:
    image: itzg/minecraft-server:2026.10.1-java25@sha256:d12aed7e35981dfe259b60fbfee77d23a19b5898a7a31dca298d18b47b7b5776
    environment:
      GELDAR_NF_EXTRA_CHUNKY_SHA256: "9f9303da0185fa0ae0e1d3f10a0f07b8d9e5a21e77931d4fc162dcc718a0ab4f"
    volumes:
      - type: bind
        source: ${NF_EXTRA_CHUNKY_JAR_HOST:-./nf-live-unset/chunky.jar}
        target: /geldar/extra-mods/chunky.jar
        read_only: true
        bind:
          create_host_path: false
