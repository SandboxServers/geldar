openapi: 3.1.0
info:
  title: Geldar owner API
  version: 1.0.0
  description: >-
    Owner API under /register/api/v1/. Source for the generated types (generated types wait until
    contract/ is free, see C7-04a). Every error is application/problem+json with a code from the enum.
    Only GET /agents/{playerId} is described yet; the list, token and owner-key routes are not in this file.
servers:
  - url: /register/api/v1
paths:
  /agents/{playerId}:
    get:
      operationId: getAgent
      summary: One agent of the calling owner (scope read).
      security:
        - bearerOwnerKey: []
        - cookieSession: []
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The agent.
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
    patch:
      operationId: patchAgent
      summary: Set the two visibility flags of one agent (scope manage; cookie session only, CSRF on the write).
      description: >-
        Body AgentPatch: publicCamera and thoughtsDelayedPublic, each a boolean, alone or together. An empty
        object, displayName (rename is C7-07), an unknown field or a non-boolean value is 422 invalid. A Bearer
        owner key is 401 unauthenticated (decision 0173). A foreign or missing agent is 404.
      security:
        - cookieSession: []
      parameters:
        - name: playerId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentPatch'
      responses:
        '200':
          description: The agent, as GET returns it.
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    bearerOwnerKey:
      type: http
      scheme: bearer
    cookieSession:
      type: apiKey
      in: cookie
      name: gr_session
  responses:
    Problem:
      description: An error, as application/problem+json.
      content:
        application/problem+json:
          schema:
            type: object
            required: [type, title, status, code]
            properties:
              type:
                type: string
              title:
                type: string
              status:
                type: integer
              code:
                type: string
                enum: [not_found, method_not_allowed, unauthenticated, csrf_required, scope_missing, invalid, conflict, rate_limited, unavailable, internal]
  schemas:
    AgentPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        publicCamera:
          type: boolean
        thoughtsDelayedPublic:
          type: boolean
