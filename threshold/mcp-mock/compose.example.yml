# Example only. Keep the tokens file outside the repo (it is git-ignored here, but do not rely on that).
# Pin the image by digest in real use: ghcr.io/sandboxservers/geldar-mcp-mock@sha256:<digest>
services:
  geldar-mcp-mock:
    image: ghcr.io/sandboxservers/geldar-mcp-mock:main
    ports: ["127.0.0.1:8787:8787"]
    volumes: ["~/.config/geldar/mcp-tokens.json:/run/secrets/mcp-tokens.json:ro"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

