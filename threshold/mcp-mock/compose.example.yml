# Example only. Keep the tokens file outside the repo (it is git-ignored here, but do not rely on that).
# Create the tokens file first (see README): the short volume syntax makes a root-owned directory when the source is missing,
# so the mounts below use the long syntax with create_host_path: false, which errors instead.
# Pin the image by digest in real use: ghcr.io/sandboxservers/geldar-mcp-mock@sha256:<digest>
services:
  geldar-mcp-mock:
    image: ghcr.io/sandboxservers/geldar-mcp-mock:main@sha256:615c9160842ed46655dca33f561eaed83b69a5e80dd4076ad8c61c898d0e7d97
    ports: ["127.0.0.1:8787:8787"]
    volumes:
      - type: bind
        source: ~/.config/geldar/mcp-tokens.json
        target: /run/secrets/mcp-tokens.json
        read_only: true
        bind: { create_host_path: false }
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

