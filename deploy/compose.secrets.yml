# Overlay for the Colo node (decision 0084). compose/colo.yml names its secret files relative to compose/secrets/,
# which is not where the node keeps them. On the node the files live in GELDAR_SECRETS_DIR (default
# /etc/geldar-colo/secrets, root-only; deploy/gen-secrets.sh creates them). Compose merges this file over the base
# by secret name. The local stack does not use this overlay.
secrets:
  postgres:
    file: ${GELDAR_SECRETS_DIR}/postgres.txt
  rcon:
    file: ${GELDAR_SECRETS_DIR}/rcon.txt
  velocity-forwarding:
    file: ${GELDAR_SECRETS_DIR}/velocity-forwarding.txt
  nats-body:
    file: ${GELDAR_SECRETS_DIR}/nats-body.txt
  nats-mind:
    file: ${GELDAR_SECRETS_DIR}/nats-mind.txt
  postgres-mcp.txt:
    file: ${GELDAR_SECRETS_DIR}/postgres-mcp.txt
  postgres-glass.txt:
    file: ${GELDAR_SECRETS_DIR}/postgres-glass.txt
  postgres-register.txt:
    file: ${GELDAR_SECRETS_DIR}/postgres-register.txt
  register-pepper:
    file: ${GELDAR_SECRETS_DIR}/register-pepper.txt
  register-github-secret:
    file: ${GELDAR_SECRETS_DIR}/register-github-secret.txt
  register-discord-secret:
    file: ${GELDAR_SECRETS_DIR}/register-discord-secret.txt
  mcp-token-pepper.txt:
    file: ${GELDAR_SECRETS_DIR}/mcp-token-pepper.txt
  nats-mcp:
    file: ${GELDAR_SECRETS_DIR}/nats-mcp.txt
  # The NATS auth overlay (compose/nats-auth.yml) names its server config and per-role password files the same way.
  nats-auth.conf:
    file: ${GELDAR_SECRETS_DIR}/nats-auth.conf
  nats-paper.txt:
    file: ${GELDAR_SECRETS_DIR}/nats-paper.txt
  nats-velocity.txt:
    file: ${GELDAR_SECRETS_DIR}/nats-velocity.txt
  nats-eventsink.txt:
    file: ${GELDAR_SECRETS_DIR}/nats-eventsink.txt
