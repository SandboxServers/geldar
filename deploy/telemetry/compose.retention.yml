# Geldar telemetry: RETENTION WINDOW override (T-24, decision 0370 D3). [AUTH]
# Use only during the retention window (README, "Retention window (N6c)"):
#   docker compose -f deploy/telemetry/compose.yml -f deploy/telemetry/compose.retention.yml up -d geldar-signoz
# It swaps SigNoz's ClickHouse DSN from geldar_reader (readonly=2, cannot run DDL) to geldar_signoz_admin (ALTER TTL grants only),
# so that POST /api/v1/settings/ttl can run ALTER TABLE ... ON CLUSTER ... MODIFY TTL. Nothing else changes.
# Afterwards remove this override and recreate geldar-signoz on the reader:
#   docker compose -f deploy/telemetry/compose.yml up -d --force-recreate geldar-signoz
# Merge: command and secrets are sequences, which Compose would append or merge; `!override` replaces them, so the reader secret
# is not mounted during the window and only the one command runs. `!override` needs Compose 2.24 or later (README, compose version).
# Every cap, port, health, security, network (geldar-telemetry-query only) and environment setting of geldar-signoz stays as in
# compose.yml (they are not mentioned here, so the merge keeps them; checked with `docker compose config`).
# The password stays out of argv and docker inspect Env, as for the reader: it is read from the secret file inside the shell.
# Secret file: root 0:0 0400 like ch_reader_password (SigNoz runs as uid 0 without DAC_OVERRIDE, so owner root is required).

secrets:
  ch_signoz_admin_password:
    file: /mnt/nvme/geldar-telemetry/secrets/ch_signoz_admin_password

services:
  geldar-signoz:
    command: !override
      - 'export SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN="tcp://geldar_signoz_admin:$$(cat /run/secrets/ch_signoz_admin_password)@geldar-ch:9000"; exec ./signoz server'
    secrets: !override
      - source: ch_signoz_admin_password
        target: ch_signoz_admin_password
