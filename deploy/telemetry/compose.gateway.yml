# Geldar telemetry gateway (T-25). FILES ONLY: nothing here has been started or pulled.
# Same project as compose.yml: use both files together (README, "Gateway (N8)"):
#   docker compose -f deploy/telemetry/compose.yml -f deploy/telemetry/compose.gateway.yml up -d geldar-gateway
# Labels: [SRC] from collector-design sections 4, 7 and 9; [AUTH] written here; [UNV] unverified until the node steps.
name: geldar-telemetry

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  # Existing Geldar Body/Colo network (external; not created by this file). The services reach the gateway here as geldar-gateway (the container name; one name, no alias).
  geldar-colo:
    external: true
    name: geldar-colo
  # Created at N2 (external). Shared with the SigNoz stack in compose.yml.
  geldar-telemetry:
    external: true
    name: geldar-telemetry

# G2 (T-10): the Postgres monitor password, read by the postgresql receiver (gateway.yaml). Same pattern as compose/colo.yml:741.
# GELDAR_SECRETS_DIR has no default: Compose refuses to render without it (the telemetry pg-secrets directory). Compose mounts the file read-only at /run/secrets.
secrets:
  otel-pg:
    file: ${GELDAR_SECRETS_DIR:?set GELDAR_SECRETS_DIR to the telemetry pg-secrets directory}/otel-pg.txt

services:
  geldar-gateway:
    # OpenTelemetry Collector contrib 0.164.0, scratch image: no shell, no wget, no healthcheck binary. Runs as 10001:10001 [AUTH].
    image: otel/opentelemetry-collector-contrib@sha256:340c9ca6a36617084c6661bdc4f0fe92b7cda5a805d61673ec8db375fddc522b # 0.164.0
    container_name: geldar-gateway
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["--config=/etc/otelcol/gateway.yaml"]
    volumes:
      - ./gateway.yaml:/etc/otelcol/gateway.yaml:ro
      # The only writable path: the persisted sending queue. Owner 10001:10001, mode 750, set at the node step.
      # Bound: queue_size 256 MiB of request bytes per signal queue (three queues) in gateway.yaml, about 1.5 GiB on disk with file overhead. NOT a fixed-size volume (owner decision, README "Limits"): the /mnt/nvme alarm is the guard.
      - /mnt/nvme/geldar-telemetry/queue:/var/lib/otelcol/queue
    environment:
      GELDAR_SIGNOZ_OTLP_ENDPOINT: geldar-signoz-otelcol:4317   # OTLP gRPC port of signoz-otelcol-config.yaml [SRC]
      GOMEMLIMIT: 800MiB   # matches memory_limiter limit_mib 800 in gateway.yaml (80% of the 1 GiB cap)
    networks:
      geldar-colo:
      geldar-telemetry:
    # G2: the postgresql receiver reads ${file:/run/secrets/otel-pg.txt}. Read-only, from the otel-pg secret above.
    secrets: [{ source: otel-pg, target: otel-pg.txt }]
    ports:
      # Loopback only: the target of the Caddy ingest route (N14). 4320 was free on the node at N1. OTLP/HTTP only; 4317 and 13133 are not published.
      - "127.0.0.1:4320:4318"
    # No healthcheck: the scratch image has no shell or client. The health_check extension on :13133 is checked from a
    # one-shot curl container on geldar-telemetry (README, "Gateway (N8)").
    # No depends_on: the gateway may start before the SigNoz collector; the exporter retries and the queue persists.
    # No docker.sock mount [AUTH].
    cpus: 0.5
    mem_limit: 1g   # batches and the persisted queue items live in memory: the heap tracks queued bytes (README, Limits)
    memswap_limit: 1g
    pids_limit: 256
    restart: unless-stopped
    logging: *logging
