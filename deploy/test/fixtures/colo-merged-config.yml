name: geldar-colo
services:
  bluemap-web:
    cap_drop:
      - ALL
    command:
      - caddy
      - file-server
      - --root
      - /srv
      - --listen
      - :8100
    depends_on:
      paper:
        condition: service_healthy
        required: true
    deploy:
      resources:
        limits:
          cpus: 0.25
          memory: "67108864"
          pids: 64
    environment:
      XDG_CONFIG_HOME: /tmp/config
      XDG_DATA_HOME: /tmp/data
    image: caddy@sha256:c3d7ee5d2b11f9dc54f947f68a734c84e9c9666c92c88a7f30b9cba5da182adb
    labels:
      com.centurylinklabs.watchtower.enable: "false"
      com.geldar.stack: colo
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    memswap_limit: "67108864"
    networks:
      colo: null
    pids_limit: 64
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        target: 8100
        published: "8100"
        protocol: tcp
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    user: 1000:1000
    volumes:
      - type: volume
        source: paper-data
        target: /srv
        read_only: true
        volume:
          subpath: bluemap/web
  eventsink:
    build:
      context: /REPO
      dockerfile: eventsink/Dockerfile
    depends_on:
      nats:
        condition: service_healthy
        required: true
      postgres:
        condition: service_healthy
        required: true
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: "536870912"
          pids: 256
    environment:
      GELDAR_NATS_PASSWORD_FILE: /run/secrets/nats-eventsink.txt
      GELDAR_NATS_URL: nats://nats:4222
      GELDAR_NATS_USER: eventsink
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres
    image: geldar-eventsink:c1
    labels:
      com.centurylinklabs.watchtower.enable: "false"
      com.geldar.stack: colo
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    memswap_limit: "536870912"
    networks:
      colo: null
    pids_limit: 256
    restart: unless-stopped
    secrets:
      - source: postgres
        target: /run/secrets/postgres
      - source: nats-eventsink.txt
        target: /run/secrets/nats-eventsink.txt
    user: 1000:1000
  geldar-mcp:
    build:
      context: /REPO
      dockerfile: threshold/mcp/Dockerfile
    cap_drop:
      - ALL
    depends_on:
      nats:
        condition: service_healthy
        required: true
      postgres:
        condition: service_healthy
        required: true
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: "536870912"
          pids: 128
    environment:
      GELDAR_MCP_BIND: 0.0.0.0
      GELDAR_MCP_DB_PASSWORD_FILE: /run/secrets/postgres-mcp.txt
      GELDAR_MCP_DEV_HOSTS: 127.0.0.1,localhost
      GELDAR_MCP_IN_CONTAINER: "1"
      GELDAR_MCP_PEPPER_FILE: /run/secrets/mcp-token-pepper.txt
      GELDAR_MCP_TRUSTED_PROXIES: 127.0.0.1
      GELDAR_NATS_PASSWORD_FILE: /run/secrets/nats-mcp.txt
      GELDAR_NATS_URL: nats://nats:4222
      GELDAR_NATS_USER: mcp
      GELDAR_SHARD: colo
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - require('node:net').connect(8788, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))
      timeout: 3s
      interval: 10s
      retries: 3
      start_period: 1m0s
    image: geldar-mcp:c1
    labels:
      com.centurylinklabs.watchtower.enable: "false"
      com.geldar.stack: colo
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    memswap_limit: "536870912"
    networks:
      colo: null
    pids_limit: 128
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        target: 8788
        published: "8788"
        protocol: tcp
    read_only: true
    restart: unless-stopped
    secrets:
      - source: postgres-mcp.txt
        target: /run/secrets/postgres-mcp.txt
      - source: mcp-token-pepper.txt
        target: /run/secrets/mcp-token-pepper.txt
      - source: nats-mcp
        target: nats-mcp.txt
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    user: 1000:1000
    volumes:
      - type: bind
        source: /REPO/shards/colo-mind.yaml
        target: /opt/geldar/shards/colo.yaml
        read_only: true
        bind:
          create_host_path: true
  glass:
    build:
      context: /REPO
      dockerfile: glass/Dockerfile
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
        required: true
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: "268435456"
          pids: 128
    environment:
      GELDAR_GLASS_DELAY_SECONDS: "60"
      GELDAR_GLASS_ENABLED: "true"
      GELDAR_GLASS_HOST: 0.0.0.0
      GELDAR_GLASS_PG_HOST: postgres
      GELDAR_GLASS_PG_PASSWORD_FILE: /run/secrets/postgres-glass.txt
      GELDAR_GLASS_PG_PORT: "5432"
      GELDAR_GLASS_PG_USER: geldar_glass
      GELDAR_GLASS_PORT: "8787"
      GELDAR_GLASS_TRUSTED_PROXIES: 127.0.0.1
      GELDAR_IN_NETWORK_HOSTS: "1"
    image: geldar-glass:c2
    labels:
      com.centurylinklabs.watchtower.enable: "false"
      com.geldar.stack: colo
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    memswap_limit: "268435456"
    networks:
      colo: null
    pids_limit: 128
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        target: 8787
        published: "8787"
        protocol: tcp
    read_only: true
    restart: unless-stopped
    secrets:
      - source: postgres-glass.txt
        target: /run/secrets/postgres-glass.txt
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    user: 1000:1000
  golem-body:
    build:
      context: /REPO
      dockerfile: golem/Dockerfile
    depends_on:
      nats:
        condition: service_healthy
        required: true
    deploy:
      resources:
        limits:
          cpus: 1
          memory: "2147483648"
          pids: 256
    entrypoint:
      - node
      - src/adam/main.ts
    environment:
      GELDAR_IN_NETWORK_HOSTS: "1"
      GELDAR_MC_HOST: velocity
      GELDAR_MC_PORT: "25565"
      GELDAR_NATS_PASSWORD_FILE: /run/secrets/nats-body.txt
      GELDAR_NATS_URL: nats://nats:4222
      GELDAR_NATS_USER: body
      GELDAR_RCON_PORT: "25575"
      GELDAR_SHARD: colo
      GELDAR_TELEMETRY_URL: null
    image: geldar-body:c1
    labels:
      com.centurylinklabs.watchtower.enable: "false"
      com.geldar.stack: colo
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    memswap_limit: "2147483648"
    networks:
      colo: null
    pids_limit: 256
    restart: unless-stopped
    secrets:
      - source: nats-body
        target: nats-body.txt
    user: 1000:1000
    volumes:
      - type: bind
        source: /REPO/shards/colo-mind.yaml
        target: /opt/geldar/shards/colo.yaml
        read_only: true
        bind:
          create_host_path: true
  nats:
    command:
      - -js
      - -sd
      - /data
      - -c
      - /etc/nats/nats-auth.conf
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: "536870912"
          pids: 256
    healthcheck:
      test:
        - CMD
        - nc
        - -z
        - 127.0.0.1
        - "4222"
      timeout: 5s
      interval: 5s
      retries: 10
      start_period: 5s
    image: nats:2.15.1-alpine@sha256:7ae34c25dfd6fe2e01c6483eabef20d796690fdcac6c4d94ca780a6cf9877fde
    labels:
      com.centurylinklabs.watchtower.enable: "false"
      com.geldar.stack: colo
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    memswap_limit: "536870912"
    networks:
      colo: null
    pids_limit: 256
    restart: unless-stopped
    secrets:
      - source: nats-auth.conf
        target: /etc/nats/nats-auth.conf
    volumes:
      - type: volume
        source: nats-data
        target: /data
        volume: {}
  paper:
    deploy:
      resources:
        limits:
          cpus: 3
          memory: "8589934592"
          pids: 512
    entrypoint:
      - /bin/sh
      - /geldar/paper-entrypoint.sh
    environment:
      ALLOW_FLIGHT: "TRUE"
      DIFFICULTY: normal
      ENABLE_RCON: "TRUE"
      ENABLE_WHITELIST: "TRUE"
      ENFORCE_WHITELIST: "TRUE"
      EULA: "TRUE"
      GELDAR_NATS_PASSWORD_FILE: /run/secrets/nats-paper.txt
      GELDAR_NATS_URL: nats://nats:4222
      GELDAR_NATS_USER: paper
      GELDAR_SHARD: colo
      GID: "1000"
      HARDCORE: "FALSE"
      MAX_PLAYERS: "400"
      MEMORY: 6G
      MOTD: Geldar - no humans
      ONLINE_MODE: "FALSE"
      PAPER_BUILD: "74"
      RCON_CMDS_STARTUP: |-
        worldborder set 3000
        gamerule keep_inventory false
        gamerule immediate_respawn false
        gamerule show_advancement_messages false
        gamerule send_command_feedback false
        gamerule spectators_generate_chunks false
      RCON_PASSWORD_FILE: /run/secrets/rcon
      SEED: "8675309"
      SIMULATION_DISTANCE: "5"
      SPAWN_PROTECTION: "0"
      TYPE: PAPER
      UID: "1000"
      VERSION: 26.1.2
      VIEW_DISTANCE: "6"
    healthcheck:
      test:
        - CMD-SHELL
        - mc-health && read -r pid start < /tmp/geldar-core.ready && [ -n "$$start" ] && [ "$$(cut -d' ' -f22 /proc/$$pid/stat 2>/dev/null)" = "$$start" ]
      timeout: 10s
      interval: 30s
      retries: 5
      start_period: 10m0s
    image: itzg/minecraft-server:2026.10.1-java25@sha256:d12aed7e35981dfe259b60fbfee77d23a19b5898a7a31dca298d18b47b7b5776
    labels:
      com.centurylinklabs.watchtower.enable: "false"
      com.geldar.stack: colo
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    memswap_limit: "8589934592"
    networks:
      colo: null
    pids_limit: 512
    restart: unless-stopped
    secrets:
      - source: rcon
        target: /run/secrets/rcon
      - source: velocity-forwarding
        target: /run/secrets/velocity-forwarding
      - source: nats-paper.txt
        target: /run/secrets/nats-paper.txt
    volumes:
      - type: volume
        source: paper-data
        target: /data
        volume: {}
      - type: bind
        source: /REPO/compose/paper/paper-entrypoint.sh
        target: /geldar/paper-entrypoint.sh
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: /REPO/plugin/core/build/libs/geldar-core.jar
        target: /plugins/geldar-core.jar
        read_only: true
        bind:
          create_host_path: true
  postgres:
    deploy:
      resources:
        limits:
          cpus: 1
          memory: "2147483648"
          pids: 256
    environment:
      POSTGRES_DB: geldar
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres
      POSTGRES_USER: geldar
    healthcheck:
      test:
        - CMD
        - pg_isready
        - -h
        - 127.0.0.1
        - -U
        - geldar
        - -d
        - geldar
      timeout: 5s
      interval: 5s
      retries: 30
      start_period: 10s
    image: pgvector/pgvector:0.8.6-pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    labels:
      com.centurylinklabs.watchtower.enable: "false"
      com.geldar.stack: colo
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    memswap_limit: "2147483648"
    networks:
      colo: null
    pids_limit: 256
    restart: unless-stopped
    secrets:
      - source: postgres
        target: /run/secrets/postgres
    volumes:
      - type: volume
        source: postgres-data
        target: /var/lib/postgresql/data
        volume: {}
      - type: bind
        source: /REPO/sql
        target: /docker-entrypoint-initdb.d
        read_only: true
        bind:
          create_host_path: true
  velocity:
    depends_on:
      nats:
        condition: service_healthy
        required: true
      paper:
        condition: service_healthy
        required: true
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: "1073741824"
          pids: 256
    environment:
      GELDAR_NATS_PASSWORD_FILE: /run/secrets/nats-velocity.txt
      GELDAR_NATS_URL: nats://nats:4222
      GELDAR_NATS_USER: velocity
      MEMORY: 512M
      TYPE: VELOCITY
      VELOCITY_BUILD_ID: "615"
      VELOCITY_VERSION: 3.5.1
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - read -r pid start < /tmp/geldar-identity.ready && [ -n "$$start" ] && [ "$$(cut -d' ' -f22 /proc/$$pid/stat 2>/dev/null)" = "$$start" ] && exec 3<>/dev/tcp/127.0.0.1/25565
      timeout: 5s
      interval: 10s
      retries: 12
      start_period: 30s
    image: itzg/mc-proxy:2026.10.2-java25@sha256:0b969bd3000d6e21ebb58444d062d63202cb552b5264b57a274fed7d2b411c0d
    labels:
      com.centurylinklabs.watchtower.enable: "false"
      com.geldar.stack: colo
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    memswap_limit: "1073741824"
    networks:
      colo: null
    pids_limit: 256
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        target: 25565
        published: "25567"
        protocol: tcp
    restart: unless-stopped
    secrets:
      - source: velocity-forwarding
        target: /run/secrets/velocity-forwarding
      - source: nats-velocity.txt
        target: /run/secrets/nats-velocity.txt
    volumes:
      - type: bind
        source: /REPO/compose/velocity/velocity.toml
        target: /config/velocity.toml
        read_only: true
        bind:
          create_host_path: true
      - type: volume
        source: velocity-data
        target: /server
        volume: {}
      - type: bind
        source: /REPO/plugin/velocity-identity/build/libs/geldar-velocity-identity.jar
        target: /plugins/geldar-velocity-identity.jar
        read_only: true
        bind:
          create_host_path: true
networks:
  colo:
    name: geldar-colo
volumes:
  nats-data:
    name: geldar-colo_nats-data
  paper-data:
    name: geldar-colo_paper-data
  postgres-data:
    name: geldar-colo_postgres-data
  velocity-data:
    name: geldar-colo_velocity-data
secrets:
  mcp-token-pepper.txt:
    name: geldar-colo_mcp-token-pepper.txt
    file: /SECRETS/mcp-token-pepper.txt
  nats-auth.conf:
    name: geldar-colo_nats-auth.conf
    file: /SECRETS/nats-auth.conf
  nats-body:
    name: geldar-colo_nats-body
    file: /SECRETS/nats-body.txt
  nats-eventsink.txt:
    name: geldar-colo_nats-eventsink.txt
    file: /SECRETS/nats-eventsink.txt
  nats-mcp:
    name: geldar-colo_nats-mcp
    file: /SECRETS/nats-mcp.txt
  nats-paper.txt:
    name: geldar-colo_nats-paper.txt
    file: /SECRETS/nats-paper.txt
  nats-velocity.txt:
    name: geldar-colo_nats-velocity.txt
    file: /SECRETS/nats-velocity.txt
  postgres:
    name: geldar-colo_postgres
    file: /SECRETS/postgres.txt
  postgres-glass.txt:
    name: geldar-colo_postgres-glass.txt
    file: /SECRETS/postgres-glass.txt
  postgres-mcp.txt:
    name: geldar-colo_postgres-mcp.txt
    file: /SECRETS/postgres-mcp.txt
  rcon:
    name: geldar-colo_rcon
    file: /SECRETS/rcon.txt
  velocity-forwarding:
    name: geldar-colo_velocity-forwarding
    file: /SECRETS/velocity-forwarding.txt
x-labels:
  com.centurylinklabs.watchtower.enable: "false"
  com.geldar.stack: colo
x-logging:
  driver: json-file
  options:
    max-file: "3"
    max-size: 10m
x-minecraft-healthcheck:
  interval: 30s
  retries: 5
  start_period: 10m
  timeout: 10s
