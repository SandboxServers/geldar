# Ledger config for the scratch project scratch-telemetry (PT-03k). Mounted read-only at
# /data/plugins/Ledger/ledger.properties by compose/opt-in/scratch-telemetry.yml.
# Edit this file on the host to flip the kill switch (row K1 of the scratch test plan); the plugin reloads it.
# No addresses and no credentials belong here.
#
# SCRATCH-ONLY "everything on" profile, approved by the owner for the scratch run: every collector is enabled
# explicitly, including the opt-in ones (curated, census, progress, cadence), which never start without
# collector.<id>.enabled=true. Rate limits, queue sizes and budgets stay at their defaults.
# Production enablement is a separate owner-approved window and must not copy this file.
enabled=true

collector.tick.enabled=true
collector.spark.enabled=true
collector.world.enabled=true
collector.server.enabled=true
collector.census.enabled=true
collector.curated.enabled=true
collector.connections.enabled=true
collector.snapshots.enabled=true
collector.progress.enabled=true
collector.cadence.enabled=true
collector.bridge.enabled=true
collector.container.enabled=true
collector.disk.enabled=true
# A path inside the container (the world folder of the itzg image); without one the disk collector does not start.
disk.area.world.path=/data/world

# JFR arm (row JFR-OH): the scratch everything-on profile plus JFR. Copy this over ledger.properties for that arm only;
# JFR is bounded (30 s, 8 MiB, the JfrSettings allow list), fails safe, and is never part of the default profile.
jfr.enabled=true
