# NeoForge 26.1.2 build 126: installer published 2026-11-01 (15 days before the 2026-11-16 pin date).
# Key is neoforge.version, not neoforge_version: the IP-literal check exempts a `version` key (word boundary),
# and an underscore is a word character, so neoforge_version would fail check:repo (decision 0132).
neoforge.version=26.1.2.126
org.gradle.jvmargs=-Xmx2g
org.gradle.caching=false
